<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' fill='%23e30613'/></svg>">
<style>
/* Swiss: white, black and one red. Grid, rules and big numbers instead of boxes and shadows. */
:root {
  --bg: #ffffff; --ink: #000000; --muted: #666666; --faint: #9a9a9a; --rule: #dcdcdc;
  --hover: #f5f5f5; --sel: #efefef; --accent: #e30613; --accent-ink: #ffffff; --ok: #000000;
  --s-applied: #000000; --s-screening: #000000; --s-interview: #e30613; --s-offer: #e30613;
  --s-rejected: #9a9a9a; --s-ghosted: #b8b8b8; --s-withdrawn: #b8b8b8; --s-other: #666666;
  --k-note: #9a9a9a; --k-interview: #e30613; --k-call: #000000; --k-email: #000000;
  --k-status: #666666; --k-other: #9a9a9a; --k-applied: #000000; --k-onboarding: #000000; --k-joining: #000000;
  /* chart series: one fixed hue per status, in config order (validated for colour-blind separation) */
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948; --series-none: #c8c8c8;
  --shadow: 0 18px 50px rgba(0, 0, 0, .18);
  --font: "Helvetica Neue", Helvetica, Arial, "Nimbus Sans", "Liberation Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --ink: #f2f2f2; --muted: #a0a0a0; --faint: #6e6e6e; --rule: #2a2a2a;
    --hover: #161616; --sel: #1d1d1d; --accent: #ff2d2d; --ok: #f2f2f2;
    --s-applied: #f2f2f2; --s-screening: #f2f2f2; --s-interview: #ff2d2d; --s-offer: #ff2d2d;
    --s-rejected: #7a7a7a; --s-ghosted: #5c5c5c; --s-withdrawn: #5c5c5c; --s-other: #a0a0a0;
    --k-note: #7a7a7a; --k-interview: #ff2d2d; --k-call: #f2f2f2; --k-email: #f2f2f2;
    --k-status: #a0a0a0; --k-other: #7a7a7a; --k-applied: #f2f2f2; --k-onboarding: #f2f2f2; --k-joining: #f2f2f2;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767; --series-none: #4a4a4a;
    --shadow: 0 18px 50px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --ink: #f2f2f2; --muted: #a0a0a0; --faint: #6e6e6e; --rule: #2a2a2a;
  --hover: #161616; --sel: #1d1d1d; --accent: #ff2d2d; --ok: #f2f2f2;
  --s-applied: #f2f2f2; --s-screening: #f2f2f2; --s-interview: #ff2d2d; --s-offer: #ff2d2d;
  --s-rejected: #7a7a7a; --s-ghosted: #5c5c5c; --s-withdrawn: #5c5c5c; --s-other: #a0a0a0;
  --k-note: #7a7a7a; --k-interview: #ff2d2d; --k-call: #f2f2f2; --k-email: #f2f2f2;
  --k-status: #a0a0a0; --k-other: #7a7a7a; --k-applied: #f2f2f2; --k-onboarding: #f2f2f2; --k-joining: #f2f2f2;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767; --series-none: #4a4a4a;
  --shadow: 0 18px 50px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
kbd { font: 700 10px/1 var(--font); padding: 2px 4px; border: 1px solid currentColor; vertical-align: 1px; }
.muted { color: var(--muted); }

.btn {
  border: 2px solid var(--ink); background: transparent; padding: 6px 12px; cursor: pointer;
  white-space: nowrap; font-weight: 700; border-radius: 0;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.danger { color: var(--accent); border-color: var(--accent); }
.btn.danger:hover { background: var(--accent); color: #fff; }
.btn.small { padding: 3px 9px; font-size: 13px; border-width: 1px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.ghost.danger { color: var(--accent); }

input[type=text], input[type=url], input[type=search], input[type=date], input[type=time], select, textarea {
  border: 0; border-bottom: 1px solid var(--ink); background: transparent; border-radius: 0;
  padding: 6px 0; width: 100%; min-width: 0;
}
textarea { resize: vertical; line-height: 1.4; }
select { cursor: pointer; }
input:focus, select:focus, textarea:focus { outline: none; border-bottom: 2px solid var(--accent); margin-bottom: -1px; }
.btn:focus-visible, .chip:focus-visible, .stat:focus-visible, .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 5; display: flex; gap: 14px 24px; align-items: flex-end; flex-wrap: wrap;
  padding: 24px 32px 14px; background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 32px; letter-spacing: -.045em; line-height: .9; white-space: nowrap; }
.brand::before { content: ""; width: 18px; height: 18px; background: var(--accent); flex: none; }
.views { display: flex; gap: 18px; }
.views button { border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--faint); font-weight: 700; }
.views button:hover { color: var(--ink); }
.views button.on { color: var(--ink); box-shadow: inset 0 -3px var(--accent); }
#search { max-width: 340px; flex: 1 1 180px; border-bottom-width: 2px; padding: 4px 0; }
.spacer { flex: 1; }
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu .pop {
  position: absolute; right: 0; top: calc(100% + 8px); background: var(--bg); border: 2px solid var(--ink);
  box-shadow: var(--shadow); padding: 6px 0; min-width: 250px; z-index: 20;
}
.menu .pop a, .menu .pop button {
  display: block; width: 100%; text-align: left; padding: 8px 14px; border: 0; background: none;
  cursor: pointer; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px;
}
.menu .pop a:hover, .menu .pop button:hover { background: var(--accent); color: #fff; }
.menu .pop hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }

/* summary, coming up, filters */
.wrap { padding: 4px 32px 60px; }
.summary { display: flex; flex-wrap: wrap; border-top: 6px solid var(--ink); margin-bottom: 20px; }
.stat {
  display: flex; flex-direction: column; align-items: flex-start; padding: 10px 22px 8px 0; min-width: 86px;
  border: 0; background: none; cursor: pointer; text-align: left;
}
.stat b { font-size: 52px; font-weight: 700; letter-spacing: -.05em; line-height: 1; color: var(--c, var(--ink)); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 700; margin-top: 5px; padding-bottom: 3px; }
.stat i { display: none; }
.stat:hover span { color: var(--accent); }
.stat.on span { box-shadow: inset 0 -3px var(--accent); }
.stat.sep { margin-left: 4px; padding-left: 22px; border-left: 1px solid var(--rule); }
.upcoming { border-top: 2px solid var(--ink); margin-bottom: 20px; }
.upcoming h2 { font-size: 12px; font-weight: 700; margin: 8px 0 2px; }
.up {
  display: grid; grid-template-columns: 230px 190px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--rule); cursor: pointer;
}
.up:first-of-type { border-top: 0; }
.up:hover { background: var(--hover); }
.up .when b { display: block; font-size: 19px; letter-spacing: -.02em; }
.up .when span { font-size: 12px; color: var(--muted); }
.up .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 4px 18px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.chip { border: 0; background: none; padding: 4px 0; cursor: pointer; font-weight: 700; color: var(--faint); font-size: 14px; }
.chip:hover { color: var(--ink); }
.chip.on { color: var(--ink); box-shadow: inset 0 -3px var(--c, var(--accent)); }
.chip.clear { color: var(--accent); font-weight: 400; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }

/* table */
.tablewrap { overflow-x: auto; border-top: 2px solid var(--ink); }
table { width: 100%; border-collapse: collapse; }
th {
  position: sticky; top: 0; background: var(--bg); text-align: left; font-size: 11px; font-weight: 700;
  padding: 8px 10px; border-bottom: 1px solid var(--ink); cursor: pointer; white-space: nowrap; user-select: none;
}
th:hover { color: var(--accent); }
td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.sel { background: var(--sel); }
tbody tr.sel td:first-child { box-shadow: inset 4px 0 var(--accent); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.nowrap { white-space: nowrap; }
.flag { color: var(--accent); }
.tag { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; margin-left: 4px; }
.tool { display: inline-block; font-size: 13px; color: var(--muted); margin-right: 10px; white-space: nowrap; }
.stale-badge { font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 6px; }
.pill { font-weight: 700; font-size: 13px; color: var(--c); white-space: nowrap; }
.pill::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--c); margin-right: 7px; }
select.st {
  appearance: none; -webkit-appearance: none; width: auto; border: 0; padding: 2px 16px; font-weight: 700;
  font-size: 13px; color: var(--c); cursor: pointer;
  background:
    linear-gradient(var(--c), var(--c)) 0 50% / 9px 9px no-repeat,
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><path d='M0 0h8L4 5z' fill='%239a9a9a'/></svg>") right 2px center / 8px 5px no-repeat;
}
select.st:hover { text-decoration: underline; }
select.st:focus { border: 0; margin: 0; outline: 2px solid var(--accent); outline-offset: 2px; }
select.st option { color: var(--ink); background: var(--bg); }
.ext { text-decoration: none; margin-left: 4px; font-size: 12px; font-weight: 700; color: var(--accent); }
.empty { padding: 48px 0; color: var(--muted); }
.empty .btn { margin: 12px 8px 0 0; }
.hint {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 32px; font-size: 12px; color: var(--faint);
  background: var(--bg); border-top: 1px solid var(--rule);
}

/* drawer */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); z-index: 10;
  background: var(--bg); border-left: 1px solid var(--rule); border-top: 6px solid var(--accent);
  box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.drawer[hidden] { display: none; }
.dh { display: flex; gap: 8px; align-items: center; padding: 16px 24px 12px; }
.dtitle { flex: 1; margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; overflow-wrap: anywhere; }
.dbody { overflow-y: auto; padding: 0 24px 40px; flex: 1; line-height: 1.5; }
.sec { padding: 14px 0 24px; border-top: 2px solid var(--ink); }
.sech { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sech h3 { margin: 0; font-size: 12px; font-weight: 700; }
.fld { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; min-width: 0; }
.fld > span { font-size: 11px; font-weight: 700; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 20px; }
.checks { display: flex; gap: 22px; margin: 2px 0 14px; }
.check { display: flex; gap: 7px; align-items: center; cursor: pointer; font-weight: 700; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
/* read view: labelled text, a muted meta line, and Edit buttons that swap in a form */
.ro { margin: 0 0 14px; }
.ro > span { font-size: 11px; font-weight: 700; color: var(--muted); }
.ro p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.metaline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 0; font-size: 14px; margin-bottom: 12px; }
.metaline i { font-style: normal; color: var(--faint); padding: 0 8px; }
.metaline .ext { margin-left: 0; font-size: 14px; }
.card { border-top: 1px solid var(--rule); padding: 14px 0 10px; }
.card:first-of-type, .eform + .card { border-top: 0; padding-top: 2px; }
.card.hl { box-shadow: inset 4px 0 var(--accent); padding-left: 14px; }
.card-h { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
.card-h h4 { margin: 0; font-size: 18px; letter-spacing: -.02em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.card-h select.st { flex: none; }
.card .tools { margin: -4px 0 12px; }
.card-a, .pcard-a { display: flex; gap: 2px; }
.card-a { justify-content: flex-end; margin-top: -4px; }
.card-a .btn, .pcard-a .btn { color: var(--muted); font-weight: 700; }
.card-a .btn:hover, .pcard-a .btn:hover { color: var(--ink); }
.card-a .btn.danger:hover, .pcard-a .btn.danger:hover { color: var(--accent); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.pcards .eform { grid-column: 1 / -1; margin: 0; }
.pcard { border: 1px solid var(--rule); padding: 10px 12px 12px; min-width: 0; overflow-wrap: anywhere; }
.pcard:hover { border-color: var(--ink); }
.pcard-h { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.pcard-h b { font-size: 16px; }
.pcard .muted { font-size: 13px; }
.pcard .ext { margin-left: 0; font-size: 13px; }
.pcard p { margin: 6px 0 0; font-size: 14px; white-space: pre-wrap; }
.eform { border: 2px solid var(--ink); padding: 12px 14px 12px; margin-bottom: 14px; }
.eform-f { display: flex; gap: 8px; justify-content: flex-end; }
.callout { margin: 4px 0 16px; padding: 12px 14px; background: var(--accent); color: #fff; font-weight: 700; }
.callout b { color: #fff; }
.empty-note { color: var(--faint); font-size: 13px; margin: 0; }

/* log */
.logform { border: 2px solid var(--ink); padding: 12px 14px; margin-bottom: 14px; }
.tpls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tpls button { font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid var(--ink); background: none; cursor: pointer; }
.tpls button:hover { background: var(--ink); color: var(--bg); }
.logrow { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; align-items: flex-end; }
.logrow select, .logrow input { width: auto; flex: 1 1 110px; }
.logrow .btn { flex: none; }
.logrow .check { flex: none; white-space: nowrap; font-size: 13px; }
.tl-group { font-size: 11px; font-weight: 700; color: var(--muted); margin: 16px 0 2px; }
.ev { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
.tl-group + .ev { border-top: 0; }
.ev .dot { width: 9px; height: 9px; background: var(--c); margin-top: 5px; }
.ev.future .dot { outline: 2px solid var(--c); outline-offset: 2px; }
.evmeta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.evmeta .k { font-weight: 700; color: var(--c); }
.evbody { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 1px; }
.evact { display: flex; gap: 2px; opacity: 0; }
.ev:hover .evact, .ev:focus-within .evact { opacity: 1; }
.evact button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; font-size: 12px; font-weight: 700; }
.evact button:hover { color: var(--accent); }
.danger-zone { padding-top: 20px; border-top: 2px solid var(--ink); text-align: right; }

/* modal */
.backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 30; display: flex;
  align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto;
}
.modal { background: var(--bg); border-top: 6px solid var(--accent); box-shadow: var(--shadow); width: 100%; max-width: 640px; padding: 20px 24px 24px; }
.modal.wide { max-width: 1080px; }
.modal h2 { margin: 0 0 16px; font-size: 30px; letter-spacing: -.04em; line-height: 1; }
.mhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.mhead h2 { margin: 0; flex: 1; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.cohint { font-size: 12px; margin: -6px 0 10px; min-height: 16px; color: var(--muted); }
.cohint b { color: var(--accent); }
.popular { display: flex; gap: 4px 12px; flex-wrap: wrap; margin: -6px 0 12px; }
.popular button { font-size: 12px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); font-weight: 700; }
.popular button:hover { color: var(--accent); }
.brief-canvas { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
.import-stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; align-items: baseline; }
.import-stats b { font-variant-numeric: tabular-nums; text-align: right; font-size: 22px; letter-spacing: -.03em; }
.warnings { max-height: 180px; overflow: auto; font-size: 12px; border-left: 4px solid var(--accent); padding: 6px 10px; }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; }

#toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 50;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
}
.toast {
  background: var(--ink); color: var(--bg); padding: 10px 16px; font-weight: 700; box-shadow: var(--shadow);
  pointer-events: auto; display: flex; gap: 14px; align-items: center;
}
.toast.error { background: var(--accent); color: #fff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }

/* dashboard */
.dash[hidden] { display: none; }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 32px; }
.panel { grid-column: span 6; border-top: 2px solid var(--ink); padding: 8px 0 28px; min-width: 0; }
.panel.wide { grid-column: span 12; }
.panel.third { grid-column: span 4; }
.panel.two-thirds { grid-column: span 8; }
.panel h2 { font-size: 12px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel h2 .muted { font-weight: 400; }
.kpis { grid-column: span 12; display: flex; flex-wrap: wrap; border-top: 6px solid var(--ink); margin-bottom: 20px; }
.kpi { padding: 10px 28px 8px 0; min-width: 110px; }
.kpi b { display: block; font-size: 52px; font-weight: 700; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi b small { font-size: 24px; letter-spacing: -.02em; }
.kpi span { display: block; font-size: 12px; font-weight: 700; margin-top: 5px; }
.kpi em { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.kpi.hot b { color: var(--accent); }
.remind { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); cursor: pointer; }
.remind:first-of-type { border-top: 0; }
.remind:hover { background: var(--hover); }
.remind .when b { display: block; font-size: 17px; letter-spacing: -.02em; }
.remind .when span { font-size: 12px; color: var(--muted); }
.remind.interview .when b { color: var(--accent); }
.remind .btn { justify-self: start; }
.remind .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.remind .k { font-size: 12px; font-weight: 700; color: var(--c); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 170px; border-bottom: 1px solid var(--ink); position: relative; padding-right: 22px; }
.bars .col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
.bars .col:hover .bar { opacity: .75; }
.bars .bar { width: 100%; background: var(--ink); border-radius: 4px 4px 0 0; min-height: 0; }
.bars .col.now .bar { background: var(--accent); }
.bars .grid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--rule); font-size: 11px; color: var(--muted); pointer-events: none; }
.bars .grid span { position: absolute; right: 0; top: -15px; background: var(--bg); padding-left: 4px; }
.bar-x { display: flex; gap: 4px; padding-right: 22px; font-size: 11px; color: var(--muted); margin-top: 5px; }
.bar-x span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
.trend { position: relative; height: 170px; border-bottom: 1px solid var(--ink); margin-right: 34px; }
.trend svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.trend path { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.trend .grid { position: absolute; left: 0; right: -34px; border-top: 1px dashed var(--rule); font-size: 11px; color: var(--muted); pointer-events: none; }
.trend .grid span { position: absolute; right: 0; top: -8px; background: var(--bg); padding-left: 4px; }
.trend .cols { position: absolute; inset: 0; display: flex; }
.trend .cols div { flex: 1; position: relative; }
.trend .cols div:hover { background: var(--hover); }
.trend .dot { position: absolute; left: 50%; width: 10px; height: 10px; margin: 0 0 -5px -5px; background: var(--ink); border-radius: 50%; box-shadow: 0 0 0 2px var(--bg); }
.trend-x { display: flex; font-size: 11px; color: var(--muted); margin: 5px 34px 0 0; }
.trend-x span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
.donut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.donut { width: 170px; height: 170px; flex: none; }
.donut circle.seg { fill: none; stroke-width: 26; cursor: default; }
.donut circle.seg:hover { stroke-width: 32; }
.donut text { fill: var(--ink); font-family: var(--font); }
.legend { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 5px 10px; align-items: center; font-size: 14px; flex: 1; min-width: 180px; }
.legend i { width: 12px; height: 12px; background: var(--c); border-radius: 2px; }
.legend b, .legend .muted { text-align: right; font-variant-numeric: tabular-nums; }
.legend button { all: unset; cursor: pointer; font-weight: 700; }
.legend button:hover { color: var(--accent); }
.hbars { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr); gap: 7px 12px; align-items: center; font-size: 14px; }
.hbars .lbl { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbars .track { display: flex; align-items: center; gap: 8px; }
.hbars .fill { height: 14px; background: var(--ink); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbars .track span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini { padding: 8px 0; border-top: 1px solid var(--rule); cursor: pointer; display: flex; gap: 10px; justify-content: space-between; }
.mini:first-of-type { border-top: 0; }
.mini:hover { background: var(--hover); }
#tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg);
  padding: 6px 10px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap;
}
#tip[hidden] { display: none; }

/* what I told them */
.told { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 3px 0 0; }
.told dt { font-weight: 700; }
.told dd { margin: 0; overflow-wrap: anywhere; }
.told-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 12px; align-items: end; margin-bottom: 4px; }
.told-add { align-self: flex-start; padding-left: 0; color: var(--muted); }

/* me */
.me { max-width: 980px; }
.me-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 6px solid var(--ink); padding: 12px 0 14px; }
.me-head h2 { flex: 1; margin: 0; font-size: 34px; letter-spacing: -.045em; line-height: 1; }
.me .headline { font-size: 18px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
.sech-a { display: flex; gap: 8px; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.projects .eform { grid-column: 1 / -1; margin: 0; }
.pcard .tools { margin-top: 8px; }
.pcard .plinks { display: flex; gap: 14px; margin-top: 8px; }
.pcard .plinks .ext, .me .metaline .ext { margin-left: 0; }
.dropbox {
  display: block; width: 100%; margin-bottom: 12px; padding: 18px 14px; text-align: center; cursor: pointer;
  border: 2px dashed var(--rule); background: none; color: var(--muted);
}
.dropbox b { color: var(--ink); }
.dropbox:hover, .dropbox:focus-visible { border-color: var(--ink); outline: none; }
.resumes.drop .dropbox { border-color: var(--accent); background: var(--hover); color: var(--ink); }
.dropbox.busy { cursor: progress; border-color: var(--ink); }
.rcard.missing { border-style: dashed; }
.rcard .file { font-size: 13px; color: var(--muted); }
.rcard .warn { color: var(--accent); font-weight: 700; font-size: 13px; }
.rcard .plinks button { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; }
.rcard .plinks button:hover { color: var(--accent); }

/* prompts */
.prompt-out { font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--hover); padding: 10px 12px; border: 0; }
.pform .fld textarea { min-height: 60px; }
.actions .pcount { font-size: 12px; align-self: center; }
[hidden] { display: none !important; }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 6px solid var(--ink); padding: 12px 0 14px; }
.cal-head h2 { margin: 0 12px 0 0; font-size: 34px; letter-spacing: -.045em; line-height: 1; flex: 1; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 2px solid var(--ink); }
.cal-dow { font-size: 11px; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--ink); }
.cal-day { min-height: 118px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 6px 6px 8px; cursor: pointer; min-width: 0; }
.cal-day:nth-child(7n) { border-right: 0; }
.cal-day:hover { background: var(--hover); }
.cal-day.out { color: var(--faint); }
.cal-day.out .cev { opacity: .55; }
.cal-num { font-size: 13px; font-weight: 700; display: inline-block; min-width: 24px; padding: 2px 4px; margin-bottom: 4px; }
.cal-day.today .cal-num { background: var(--accent); color: #fff; }
.cev {
  display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 3px 4px 3px 8px;
  margin-top: 2px; font-size: 12px; line-height: 1.3; box-shadow: inset 3px 0 var(--c); overflow: hidden;
}
.cev:hover { background: var(--bg); outline: 1px solid var(--ink); }
.cev b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cev span { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cev.interview { background: var(--accent); color: #fff; box-shadow: none; }
.cev.interview span { color: #fff; }
.cev.past { opacity: .6; }
.cev.rem b::after, .rem-key::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-left: 5px; vertical-align: 2px; }
.cal-legend .rem-key::before { display: none; }
.cal-agenda { display: none; }
.cal-legend { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.cal-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--c); margin-right: 6px; }

@media (max-width: 720px) {
  .dash { gap: 0; }
  .panel, .panel.third, .panel.two-thirds { grid-column: span 12; }
  .kpi { min-width: 90px; padding-right: 18px; }
  .kpi b { font-size: 36px; }
  .remind { grid-template-columns: 1fr auto; }
  .remind .what { grid-column: 1 / -1; }
  .cal-head h2 { font-size: 26px; flex-basis: 100%; }
  .cal-day { min-height: 54px; padding: 3px; }
  .cal-num { font-size: 12px; min-width: 0; padding: 1px 3px; }
  .cev { padding: 0; height: 5px; margin-top: 3px; box-shadow: none; background: var(--c); }
  .cev.interview { background: var(--accent); }
  .cev b, .cev span { display: none; }
  .cal-agenda { display: block; margin-top: 18px; }
  .told-row { grid-template-columns: 1fr auto; }
  .told-row [name=told_value] { grid-column: 1; }
  .me-head h2 { font-size: 26px; }
}
@media (max-width: 720px) {
  .top { padding: 16px 16px 10px; gap: 12px 16px; }
  .brand { font-size: 26px; }
  .views { flex-wrap: wrap; gap: 4px 16px; }
  .wrap { padding: 4px 16px 60px; }
  .stat { min-width: 64px; padding-right: 14px; }
  .stat b { font-size: 36px; }
  .stat.sep { padding-left: 14px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .up { grid-template-columns: 1fr; gap: 2px; }
  .hint { display: none; }
  #search { max-width: none; order: 10; flex-basis: 100%; }
  .dh, .dbody { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Job Tracker</div>
  <div class="views" role="tablist">
    <button data-view="dashboard">Dashboard</button>
    <button data-view="applications">Applications</button>
    <button data-view="companies">Companies</button>
    <button data-view="calendar">Calendar</button>
    <button data-view="me">Me</button>
  </div>
  <input id="search" type="search" placeholder="Search everything  ( / )" autocomplete="off">
  <div class="spacer"></div>
  <button id="btn-new" class="btn primary">+ New <kbd>n</kbd></button>
  <details class="menu" id="menu">
    <summary class="btn" title="Import, export and more">⋯</summary>
    <div class="pop">
      <button data-menu="import">Import from CSV…</button>
      <hr>
      <a data-export="companies.csv" download>Export companies (CSV)</a>
      <a data-export="applications.csv" download>Export applications (CSV)</a>
      <a data-export="projects.csv" download>Export projects (CSV)</a>
      <a data-export="backup.json" download>Full backup (JSON)</a>
      <hr>
      <button data-menu="theme">Switch light / dark</button>
      <button data-menu="keys">Keyboard shortcuts</button>
    </div>
  </details>
</header>

<div class="wrap">
  <div id="list-view">
    <section id="summary" class="summary"></section>
    <section id="upcoming" class="upcoming" hidden></section>
    <section id="chips" class="chips"></section>
    <div class="tablewrap"><table id="grid"><thead></thead><tbody></tbody></table><div id="empty" class="empty" hidden></div></div>
  </div>
  <section id="calendar" hidden></section>
  <section id="dashboard" class="dash" hidden></section>
  <section id="me" class="me" hidden></section>
</div>
<div class="hint"><kbd>n</kbd> new · <kbd>/</kbd> search · <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>Enter</kbd> open · <kbd>b</kbd> brief · <kbd>1</kbd>–<kbd>5</kbd> views · <kbd>Esc</kbd> close · <kbd>?</kbd> help</div>
<div id="tip" hidden></div>

<aside id="drawer" class="drawer" hidden></aside>
<input type="file" id="file-import" accept=".csv,text/csv" hidden>
<input type="file" id="file-projects" accept=".csv,text/csv" hidden>
<input type="file" id="file-resume" accept=".pdf,.docx,.doc,.odt,.rtf,.txt,.md" multiple hidden>
<datalist id="co-list"></datalist>
<datalist id="told-labels"></datalist>
<div id="toast"></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Colours are CSS variables so the dark theme can swap them (see --s-* and --k-* in the styles).
const STATUS_VARS = { Applied: "applied", Screening: "screening", Interview: "interview", Offer: "offer", Rejected: "rejected", Ghosted: "ghosted", Withdrawn: "withdrawn" };
const statusColor = s => `var(--s-${STATUS_VARS[s] || "other"})`;
const REMOTE = { "": "—", remote: "Remote", hybrid: "Hybrid", onsite: "On-site" };
const KINDS = { note: "Note", interview: "Interview", onboarding: "Onboarding", call: "Call / chat", email: "Email", status: "Status", other: "Other", applied: "Applied" };
const kindColor = k => `var(--k-${["note", "interview", "onboarding", "call", "email", "status", "applied", "joining"].includes(k) ? k : "other"})`;
// Kinds that are scheduled rather than logged: they count as coming up all day on the day itself.
const SCHEDULED = ["interview", "onboarding"];
const TEMPLATES = {
  interview: { kind: "interview", body: "Online interview with ", label: "Interview scheduled" },
  onboarding: { kind: "onboarding", body: "First day / onboarding", label: "Onboarding" },
  talked: { kind: "call", body: "Talked to ", label: "Talked to…", today: true },
  followup: { kind: "email", body: "Sent a follow-up email", label: "Sent follow-up", today: true },
  reply: { kind: "email", body: "Heard back: ", label: "Heard back", today: true },
  note: { kind: "note", body: "", label: "Note" },
};

const VIEWS = ["dashboard", "applications", "companies", "calendar", "me"];
const isList = () => S.view === "applications" || S.view === "companies";

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem("jt." + key);
    localStorage.setItem("jt." + key, value);
  } catch { return null; }
}

const S = {
  data: null, view: "dashboard", cal: null, meEdit: null,   // the tracker always opens on the dashboard
  filters: new Set(), status: null, q: "", rows: [], sel: -1, open: null,
  sort: { applications: { key: "applied", dir: -1 }, companies: { key: "activity", dir: -1 } },
};

// ---------- data -------------------------------------------------------------------------------

async function api(method, path, body) {
  const opts = { method, headers: { "X-Token": TOKEN } };
  if (body !== undefined) {
    opts.body = typeof body === "string" ? body : JSON.stringify(body);
    opts.headers["Content-Type"] = typeof body === "string" ? "text/plain" : "application/json";
  }
  let res;
  try { res = await fetch(path, opts); }
  catch { throw new Error("Can't reach the tracker. Is `jobs` still running?"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function reload() {
  S.data = await api("GET", "/api/data");
  index();
}

function group(rows) {
  const m = new Map();
  for (const r of rows) { if (!m.has(r.company_id)) m.set(r.company_id, []); m.get(r.company_id).push(r); }
  return m;
}

function index() {
  const d = S.data;
  S.co = new Map(d.companies.map(c => [c.id, c]));
  S.appsBy = group(d.applications);
  S.eventsBy = group(d.events);
  S.peopleBy = group(d.contacts);
  $("#co-list").innerHTML = d.companies.map(c => `<option value="${esc(c.name)}">`).join("");
  const labels = new Set(["Resume", "Salary", "Notice period", "Available from", "Location", "Visa / work permit"]);
  for (const a of d.applications) for (const r of a.told) if (r.label) labels.add(r.label);
  $("#told-labels").innerHTML = [...labels].map(l => `<option value="${esc(l)}">`).join("");
}

function replaceRow(table, row) {
  const list = S.data[table];
  const i = list.findIndex(r => r.id === row.id);
  if (i >= 0) list[i] = row; else list.push(row);
  index();
}
const findRow = (table, id) => S.data[table].find(r => r.id === id);

// ---------- dates & derived values -------------------------------------------------------------

const dayNum = s => s ? Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5 : null;
const daysSince = s => s ? dayNum(S.data.today) - dayNum(s) : null;
const asDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
function fmtDate(s, opts = {}) {
  if (!s) return "";
  const d = asDate(s), year = d.getFullYear() !== +S.data.today.slice(0, 4) || opts.year;
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", ...(year ? { year: "numeric" } : {}), ...(opts.weekday ? { weekday: "short" } : {}) });
}
function ago(n) {
  if (n == null) return "";
  if (n === 0) return "today";
  if (n === 1) return "yesterday";
  if (n === -1) return "tomorrow";
  if (n < 0) return `in ${-n} days`;
  if (n < 14) return `${n} days ago`;
  if (n < 60) return `${Math.floor(n / 7)} weeks ago`;
  return `${Math.floor(n / 30)} months ago`;
}
// "22:00" -> "10:00 PM" (or "22:00", following the browser's locale)
const fmtTime = t => t ? new Date(2000, 0, 1, +t.slice(0, 2), +t.slice(3, 5)).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "";
const evDate = e => e.event_date || e.created_at.slice(0, 10);
const byWhen = (x, y) => (x.event_date + (x.event_time || "99")).localeCompare(y.event_date + (y.event_time || "99"));
const coApps = cid => S.appsBy.get(cid) || [];
const coEvents = cid => S.eventsBy.get(cid) || [];
// Upcoming: a future date, or today when it's an interview/onboarding or its time hasn't passed yet.
function isUpcoming(e) {
  if (!e.event_date || e.event_date < S.data.today) return false;
  if (e.event_date > S.data.today) return true;
  const now = new Date().toTimeString().slice(0, 5);
  return SCHEDULED.includes(e.kind) || (!!e.event_time && e.event_time >= now);
}
// Reminders: upcoming events you ticked "Set reminder" on. Only these show in the Coming up lists.
const isReminder = e => !!e.remind && isUpcoming(e);
const upcomingFor = cid => coEvents(cid).filter(isReminder).sort(byWhen);
const latestApp = cid => coApps(cid).slice().sort((a, b) => (b.date_applied || "").localeCompare(a.date_applied || "") || b.id - a.id)[0];
const isActive = a => S.data.config.active_statuses.includes(a.status);
const splitTools = s => (s || "").split(",").map(t => t.trim()).filter(Boolean);

function appActivity(a) {
  let last = a.date_applied || a.created_at.slice(0, 10);
  for (const e of coEvents(a.company_id)) {
    if (e.application_id && e.application_id !== a.id) continue;
    const d = evDate(e);
    if (d <= S.data.today && d > last) last = d;
  }
  return last;
}
function isStale(a) {
  const cfg = S.data.config;
  if (!cfg.stale_statuses.includes(a.status) || coEvents(a.company_id).some(isUpcoming)) return false;
  return daysSince(appActivity(a)) > cfg.stale_days;
}
function coActivity(cid) {
  let last = "";
  for (const a of coApps(cid)) { const d = appActivity(a); if (d > last) last = d; }
  for (const e of coEvents(cid)) { const d = evDate(e); if (d <= S.data.today && d > last) last = d; }
  return last || S.co.get(cid).created_at.slice(0, 10);
}
function statusOptions(current) {
  const list = [...S.data.config.statuses];
  if (current && !list.includes(current)) list.push(current);
  return `<option value="">—</option>` + list.map(s => `<option ${s === current ? "selected" : ""}>${esc(s)}</option>`).join("");
}
const statusSelect = (a, extra = "") =>
  `<select class="st" data-status="${a.id}" style="--c:${statusColor(a.status)}" ${extra}>${statusOptions(a.status)}</select>`;
const host = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } };
const href = url => /^https?:\/\//i.test(url) ? url : "https://" + url;

// Resumes: a label if you gave one, else the file name. Missing files still show by name.
const sortedResumes = () => S.data.resumes.slice().sort((a, b) => b.is_default - a.is_default || (a.label || a.filename).localeCompare(b.label || b.filename));
const resumeName = id => { const r = id && findRow("resumes", id); return r ? r.label || r.filename : ""; };
const resumeUrl = id => `/resume/${id}?t=${encodeURIComponent(TOKEN)}`;
const resumeLink = id => { const r = findRow("resumes", id); return !r ? "" : r.missing ? esc(resumeName(id)) : `<a class="ext" href="${resumeUrl(id)}" target="_blank" rel="noopener">${esc(resumeName(id))} ↗</a>`; };
const defaultResumeId = () => S.data.resumes.find(r => r.is_default && !r.missing)?.id ?? null;
const fmtSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
// The "Resume sent" picker; nothing at all until you have a resume.
function resumeField(current) {
  if (!S.data.resumes.length) return "";
  const opts = sortedResumes().filter(r => !r.missing || r.id === current)
    .map(r => `<option value="${r.id}" ${r.id === current ? "selected" : ""}>${esc(r.label || r.filename)}</option>`).join("");
  return fld("Resume sent", `<select name="resume_id"><option value="">None</option>${opts}</select>`);
}

// ---------- main view --------------------------------------------------------------------------

const FILTERS = {
  urgent: { label: "★ Urgent", co: c => c.urgent },
  remote: { label: "Remote", co: c => c.remote === "remote" },
  bigtech: { label: "Big tech", co: c => c.is_big_tech },
  active: { label: "Active", app: isActive, cos: cid => coApps(cid).some(isActive) },
  stale: { label: "Needs a follow-up", app: isStale, cos: cid => coApps(cid).some(isStale) },
  notapplied: { label: "Not applied yet", only: "companies", cos: cid => !coApps(cid).length },
};

const COLS = {
  applications: [
    { key: "urgent", label: "★", get: r => r.c.urgent ? 1 : 0, cell: r => r.c.urgent ? `<span class="flag" title="Urgent">★</span>` : "" },
    { key: "company", label: "Company", get: r => r.c.name.toLowerCase(),
      cell: r => `<b>${esc(r.c.name)}</b>${r.c.is_big_tech ? ` <span class="tag">Big tech</span>` : ""}` },
    { key: "position", label: "Position", get: r => r.a.position.toLowerCase(),
      cell: r => esc(r.a.position || "—") + (r.a.job_url ? `<a class="ext" href="${esc(href(r.a.job_url))}" target="_blank" rel="noopener" title="Open job post">↗</a>` : "") },
    { key: "status", label: "Status", get: r => { const i = S.data.config.statuses.indexOf(r.a.status); return i < 0 ? 99 : i; }, cell: r => statusSelect(r.a) },
    { key: "applied", label: "Applied", cls: "nowrap", get: r => r.a.date_applied || "", cell: r => fmtDate(r.a.date_applied) },
    { key: "days", label: "Days", cls: "num", get: r => daysSince(r.a.date_applied) ?? -1, cell: r => daysSince(r.a.date_applied) ?? "" },
    { key: "tools", label: "Tools", get: r => r.a.tools.toLowerCase(), cell: r => toolChips(r.a.tools, 4) },
    { key: "remote", label: "Remote", get: r => r.c.remote, cell: r => REMOTE[r.c.remote] ?? esc(r.c.remote) },
    { key: "activity", label: "Last activity", cls: "nowrap", get: r => appActivity(r.a),
      cell: r => ago(daysSince(appActivity(r.a))) + (isStale(r.a) ? `<span class="stale-badge" title="No activity for over ${S.data.config.stale_days} days">follow up</span>` : "") },
  ],
  companies: [
    { key: "urgent", label: "★", get: r => r.c.urgent ? 1 : 0, cell: r => r.c.urgent ? `<span class="flag" title="Urgent">★</span>` : "" },
    { key: "company", label: "Company", get: r => r.c.name.toLowerCase(),
      cell: r => `<b>${esc(r.c.name)}</b>${r.c.is_big_tech ? ` <span class="tag">Big tech</span>` : ""}` +
        (r.c.website ? ` <a class="ext" href="${esc(href(r.c.website))}" target="_blank" rel="noopener">${esc(host(r.c.website))} ↗</a>` : "") },
    { key: "remote", label: "Remote", get: r => r.c.remote, cell: r => REMOTE[r.c.remote] ?? esc(r.c.remote) },
    { key: "apps", label: "Apps", cls: "num", get: r => coApps(r.c.id).length, cell: r => coApps(r.c.id).length || "" },
    { key: "status", label: "Latest", get: r => latestApp(r.c.id)?.status || "",
      cell: r => { const a = latestApp(r.c.id); return a ? `<span class="pill" style="--c:${statusColor(a.status)}">${esc(a.status || "—")}</span> <span class="muted">${esc(a.position)}</span>` : `<span class="muted">not applied</span>`; } },
    { key: "next", label: "Coming up", cls: "nowrap", get: r => upcomingFor(r.c.id)[0]?.event_date || "~",
      cell: r => { const e = upcomingFor(r.c.id)[0]; return e ? `${fmtDate(e.event_date, { weekday: true })}${e.event_time ? " " + fmtTime(e.event_time) : ""}` : ""; } },
    { key: "activity", label: "Last activity", cls: "nowrap", get: r => coActivity(r.c.id),
      cell: r => ago(daysSince(coActivity(r.c.id))) + (coApps(r.c.id).some(isStale) ? `<span class="stale-badge">follow up</span>` : "") },
  ],
};

function toolChips(tools, max = 99) {
  const list = splitTools(tools);
  const shown = list.slice(0, max).map(t => `<span class="tool">${esc(t)}</span>`).join("");
  return shown + (list.length > max ? `<span class="muted"> +${list.length - max}</span>` : "");
}

function haystack(c, a) {
  const people = (S.peopleBy.get(c.id) || []).map(p => `${p.name} ${p.role} ${p.notes}`);
  const parts = [c.name, c.website, c.about, c.notes, c.refs, ...people];
  const apps = a ? [a] : coApps(c.id);
  for (const x of apps) parts.push(x.position, x.tools, x.status, x.comments, x.responsibilities, x.offer, ...x.told.map(r => `${r.label} ${r.value}`), resumeName(x.resume_id));
  return parts.join(" ").toLowerCase();
}

function buildRows() {
  const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const f = [...S.filters].map(k => FILTERS[k]).filter(x => !x.only || x.only === S.view);
  let rows;
  if (S.view === "applications") {
    rows = S.data.applications.map(a => ({ a, c: S.co.get(a.company_id) })).filter(r =>
      f.every(x => x.co ? x.co(r.c) : x.app ? x.app(r.a) : true) &&
      (!S.status || r.a.status === S.status) &&
      (!words.length || (h => words.every(w => h.includes(w)))(haystack(r.c, r.a))));
  } else {
    rows = S.data.companies.map(c => ({ c })).filter(r =>
      f.every(x => x.co ? x.co(r.c) : x.cos ? x.cos(r.c.id) : true) &&
      (!S.status || coApps(r.c.id).some(a => a.status === S.status)) &&
      (!words.length || (h => words.every(w => h.includes(w)))(haystack(r.c))));
  }
  const { key, dir } = S.sort[S.view];
  const col = COLS[S.view].find(c => c.key === key);
  rows.sort((x, y) => {
    const a = col.get(x), b = col.get(y);
    return (a < b ? -1 : a > b ? 1 : 0) * dir || x.c.name.localeCompare(y.c.name);
  });
  S.rows = rows;
}

function renderSummary() {
  const apps = S.data.applications, cfg = S.data.config;
  const counts = {};
  for (const a of apps) counts[a.status] = (counts[a.status] || 0) + 1;
  const week = apps.filter(a => a.date_applied && daysSince(a.date_applied) < 7).length;
  const stale = apps.filter(isStale).length;
  const notApplied = S.data.companies.filter(c => !coApps(c.id).length).length;
  const stat = (n, label, attrs, on, color) =>
    `<button class="stat ${on ? "on" : ""}" ${attrs} ${color ? `style="--c:${color}"` : ""}><b>${n}</b><span>${color ? "<i></i>" : ""}${label}</span></button>`;
  $("#summary").innerHTML =
    cfg.statuses.map(s => stat(counts[s] || 0, esc(s), `data-stat-status="${esc(s)}"`, S.status === s, statusColor(s))).join("") +
    stat(week, "applied this week", `data-stat="week"`, false) +
    stat(stale, "need a follow-up", `data-stat="stale"`, S.filters.has("stale"), stale ? "var(--accent)" : "") +
    stat(notApplied, "not applied yet", `data-stat="notapplied"`, S.filters.has("notapplied")) +
    stat(S.data.companies.length, "companies", `data-stat="companies"`, false);
  $(".stat[data-stat=week]").classList.add("sep");
}

function renderUpcoming() {
  const cfg = S.data.config, box = $("#upcoming");
  const list = S.data.events.filter(e => isReminder(e) && daysSince(e.event_date) >= -cfg.upcoming_days).sort(byWhen);
  box.hidden = !list.length;
  if (!list.length) return;
  box.innerHTML = `<h2>Coming up</h2>` + list.slice(0, 8).map(e => {
    const c = S.co.get(e.company_id);
    return `<div class="up" data-open="${e.company_id}">
      <div class="when"><b>${fmtDate(e.event_date, { weekday: true })}${e.event_time ? " · " + fmtTime(e.event_time) : ""}</b><span>${ago(daysSince(e.event_date))}</span></div>
      <div><b>${esc(c.name)}</b><div class="muted" style="font-size:12px">${esc(KINDS[e.kind] || e.kind)}</div></div>
      <div class="what">${esc(e.body)}</div>
      <button class="btn small" data-brief="${e.company_id}" data-brief-app="${e.application_id || ""}">Brief</button>
    </div>`;
  }).join("");
}

function renderChips() {
  const keys = Object.keys(FILTERS).filter(k => !FILTERS[k].only || FILTERS[k].only === S.view);
  let html = keys.map(k => `<button class="chip ${S.filters.has(k) ? "on" : ""}" data-filter="${k}">${FILTERS[k].label}</button>`).join("");
  if (S.status) html += `<button class="chip on" data-clear-status style="--c:${statusColor(S.status)}">Status: ${esc(S.status)} ✕</button>`;
  if (S.filters.size || S.status || S.q) html += `<button class="chip clear" data-clear>Clear all</button>`;
  const noun = S.view === "applications" ? "application" : "compan";
  const n = S.rows.length;
  html += `<span class="count">${n} ${noun}${S.view === "applications" ? (n === 1 ? "" : "s") : (n === 1 ? "y" : "ies")}</span>`;
  $("#chips").innerHTML = html;
}

function renderTable() {
  const cols = COLS[S.view], srt = S.sort[S.view];
  $("#grid thead").innerHTML = "<tr>" + cols.map(c =>
    `<th data-sort="${c.key}" class="${c.cls || ""}">${c.label}${srt.key === c.key ? (srt.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";
  $("#grid tbody").innerHTML = S.rows.map((r, i) =>
    `<tr data-i="${i}" class="${i === S.sel ? "sel" : ""}">` + cols.map(c => `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("") + "</tr>").join("");
  const empty = $("#empty");
  empty.hidden = S.rows.length > 0;
  if (!S.rows.length) {
    const isCo = S.view === "companies";
    const none = !(isCo ? S.data.companies : S.data.applications).length;
    empty.innerHTML = none && !(S.q || S.filters.size || S.status)
      ? `No ${isCo ? "companies" : "applications"} yet.<br><button class="btn primary" id="empty-new">+ Add your first ${isCo ? "company" : "application"}</button>` +
        (S.data.companies.length ? "" : `<button class="btn" data-menu="import">Import from your spreadsheet (CSV)</button>`)
      : `Nothing matches. <br><button class="btn" data-clear>Clear filters</button>`;
  }
}

function renderMain() {
  $$(".views button").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));
  $("#list-view").hidden = !isList();
  $("#calendar").hidden = S.view !== "calendar";
  $("#dashboard").hidden = S.view !== "dashboard";
  $("#me").hidden = S.view !== "me";
  if (S.view === "me") return renderMe();
  if (S.view === "calendar") return renderCalendar();
  if (S.view === "dashboard") return renderDashboard();
  buildRows();
  if (S.sel >= S.rows.length) S.sel = S.rows.length - 1;
  renderSummary();
  renderUpcoming();
  renderChips();
  renderTable();
}

function setView(view) {
  S.view = view; S.sel = -1;
  if (view === "applications") S.filters.delete("notapplied");
  renderMain();
}

function moveSel(d) {
  if (!isList() || !S.rows.length) return;
  S.sel = Math.max(0, Math.min(S.rows.length - 1, S.sel + d));
  $$("#grid tbody tr").forEach(tr => tr.classList.toggle("sel", +tr.dataset.i === S.sel));
  $(`#grid tbody tr[data-i="${S.sel}"]`)?.scrollIntoView({ block: "nearest" });
}
function openRow(i) {
  const r = isList() && S.rows[i];
  if (r) { S.sel = i; openDrawer(r.c.id, r.a?.id); }
}

async function setStatus(appId, status) {
  try {
    await api("PATCH", `/api/applications/${appId}`, { status });
    await reload();
    renderMain();
    if (S.open) renderDrawer(true);
    toast(`Status set to ${status || "—"}`);
  } catch (err) { toast(err.message, "error"); }
}

// ---------- calendar items ---------------------------------------------------------------------

const dayStr = n => new Date(n * 864e5).toISOString().slice(0, 10);   // the inverse of dayNum
const weekStart = n => n - (new Date(n * 864e5).getUTCDay() + 6) % 7;   // weeks start on Monday
const kindLabel = k => k === "joining" ? "Joining" : KINDS[k] || k;

// Everything with a date between `from` and `to` (inclusive): logged events, plus joining dates.
// Status changes are left out; they are bookkeeping, not plans.
function calItems(from, to) {
  const items = [];
  for (const e of S.data.events) {
    if (e.kind === "status" || !e.event_date || e.event_date < from || e.event_date > to) continue;
    items.push({ ev: e, date: e.event_date, time: e.event_time, kind: e.kind, cid: e.company_id, appId: e.application_id, body: e.body });
  }
  for (const a of S.data.applications) {
    if (!a.joining_date || a.joining_date < from || a.joining_date > to) continue;
    items.push({ date: a.joining_date, time: "", kind: "joining", cid: a.company_id, appId: a.id, body: `Joining as ${a.position || "new role"}` });
  }
  return items.sort((x, y) => (x.date + (x.time || "99")).localeCompare(y.date + (y.time || "99")));
}

// What's coming up in the next `days` days, today's already-past entries excluded.
const reminders = days => calItems(S.data.today, dayStr(dayNum(S.data.today) + days))
  .filter(it => it.ev ? isReminder(it.ev) : true);

// ---------- dashboard --------------------------------------------------------------------------

const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
// Each status keeps one chart colour, by its place in the settings list, so a colour never changes meaning.
const seriesColor = s => { const i = S.data.config.statuses.indexOf(s); return i >= 0 && i < 8 ? `var(--series-${i + 1})` : "var(--series-none)"; };
const niceCeil = n => { if (n <= 5) return Math.max(n, 1); const p = 10 ** Math.floor(Math.log10(n)); return [1, 2, 5, 10].map(k => k * p).find(v => v >= n); };
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function renderDashboard() {
  const d = S.data, cfg = d.config, apps = d.applications;
  const sent = apps.filter(a => a.date_applied || a.status);
  const replied = sent.filter(heardBack);
  const week = apps.filter(a => a.date_applied && daysSince(a.date_applied) < 7 && daysSince(a.date_applied) >= 0).length;
  const soon = reminders(cfg.reminder_days);
  const interviews = calItems(d.today, dayStr(dayNum(d.today) + cfg.reminder_days)).filter(it => it.kind === "interview" && isUpcoming(it.ev)).length;
  const stale = apps.filter(isStale).sort((a, b) => appActivity(a).localeCompare(appActivity(b)));
  const offers = apps.filter(a => a.status === "Offer").length;
  const ghost = ghostable();
  const kpi = (n, label, sub = "", hot = false) => `<div class="kpi ${hot ? "hot" : ""}"><b>${n}</b><span>${label}</span>${sub ? `<em>${sub}</em>` : ""}</div>`;

  $("#dashboard").innerHTML = `
    <div class="kpis">
      ${kpi(sent.length, "applications", `${week} this week`)}
      ${kpi(apps.filter(isActive).length, "active")}
      ${kpi(`${pct(replied.length, sent.length)}<small>%</small>`, "heard back", `${replied.length} of ${sent.length}`)}
      ${kpi(interviews, `interview${interviews === 1 ? "" : "s"}`, `next ${cfg.reminder_days} days`, interviews > 0)}
      ${kpi(offers, offers === 1 ? "offer" : "offers")}
      ${kpi(stale.length, "need a follow-up", `quiet for ${cfg.stale_days}+ days`)}
    </div>
    <section class="panel wide">
      <h2><span>Next ${cfg.reminder_days} days</span><button class="btn small" data-cal-add>+ Add event</button></h2>
      ${soon.length ? soon.map(reminderRow).join("") : `<p class="empty-note">Nothing scheduled. Add interviews and other dates from the Calendar or a company's log.</p>`}
    </section>
    <section class="panel"><h2><span>Applications per week</span><span class="muted">last 12 weeks</span></h2>${weeklyChart()}</section>
    <section class="panel"><h2><span>By status</span><span class="muted">click to filter</span></h2>${statusDonut()}</section>
    <section class="panel"><h2><span>Heard back, by month applied</span><span class="muted">recent months are still settling</span></h2>${responseTrend()}</section>
    <section class="panel"><h2><span>Most asked-for tools</span><span class="muted">across all applications</span></h2>${toolBars()}</section>
    <section class="panel wide"><h2><span>Needs a follow-up</span><span>${ghost.length ? `<button class="btn small" data-ghost-all title="Still at ${esc(cfg.statuses[0])} with nothing for ${cfg.ghosted_days}+ days">Mark ${ghost.length} as Ghosted</button>` : `<span class="muted">oldest first</span>`}</span></h2>
      ${stale.length ? stale.slice(0, 8).map(a => `<div class="mini" data-open="${a.company_id}" data-open-app="${a.id}">
          <span><b>${esc(S.co.get(a.company_id).name)}</b> <span class="muted">${esc(a.position)}</span></span>
          <span class="muted">${ago(daysSince(appActivity(a)))}</span></div>`).join("")
        : `<p class="empty-note">Nothing waiting on you.</p>`}
    </section>`;
}

// Heard back: moved past the first status, and not ghosted or withdrawn.
const heardBack = a => !!a.status && a.status !== S.data.config.statuses[0] && !["Ghosted", "Withdrawn"].includes(a.status);

// Share of each month's applications that got a reply, for the last 6 months.
function responseTrend() {
  const months = 6, [ty, tm] = S.data.today.split("-").map(Number);
  const keys = [...Array(months)].map((_, i) => new Date(Date.UTC(ty, tm - months + i, 1)).toISOString().slice(0, 7));
  const tally = new Map(keys.map(k => [k, { n: 0, yes: 0 }]));
  for (const a of S.data.applications) {
    const t = a.date_applied && tally.get(a.date_applied.slice(0, 7));
    if (t) { t.n++; if (heardBack(a)) t.yes++; }
  }
  const pts = keys.map((k, i) => ({ k, ...tally.get(k), x: (i + .5) * 100 / months }));
  if (!pts.some(p => p.n)) return `<p class="empty-note">No applications in the last 6 months.</p>`;
  // Months with no applications have no rate, so the line breaks there instead of dropping to 0%.
  let d = "", prev = false;
  for (const p of pts) {
    if (!p.n) { prev = false; continue; }
    d += `${prev ? "L" : "M"}${p.x} ${100 - pct(p.yes, p.n)} `;
    prev = true;
  }
  const label = k => new Date(+k.slice(0, 4), +k.slice(5) - 1, 1).toLocaleDateString(undefined, { month: "short" });
  const grid = [100, 50, 0].map(v => `<div class="grid" style="bottom:${v}%"><span>${v}%</span></div>`).join("");
  const cols = pts.map(p => `<div data-tip="${label(p.k)}: ${p.n ? `${pct(p.yes, p.n)}% (${p.yes} of ${plural(p.n, "application")})` : "no applications"}">
    ${p.n ? `<i class="dot" style="bottom:${pct(p.yes, p.n)}%"></i>` : ""}</div>`).join("");
  return `<div class="trend" role="img" aria-label="Heard back by month: ${pts.map(p => `${label(p.k)} ${p.n ? pct(p.yes, p.n) + "%" : "none"}`).join(", ")}">
      ${grid}<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" vector-effect="non-scaling-stroke"></path></svg><div class="cols">${cols}</div></div>
    <div class="trend-x">${pts.map(p => `<span>${label(p.k)}</span>`).join("")}</div>`;
}

// Still at the first status, nothing logged for `ghosted_days` and nothing scheduled.
const ghostable = () => {
  const cfg = S.data.config;
  if (!cfg.statuses.includes("Ghosted")) return [];
  return S.data.applications.filter(a => a.status === cfg.statuses[0] && daysSince(appActivity(a)) >= cfg.ghosted_days
    && !coEvents(a.company_id).some(isUpcoming));
};

async function markGhosted() {
  const list = ghostable(), cfg = S.data.config;
  if (!list.length) return;
  const names = list.slice(0, 12).map(a => "  • " + describeApp(a)).join("\n") + (list.length > 12 ? `\n  …and ${list.length - 12} more` : "");
  if (!confirm(`Mark ${plural(list.length, "application")} as Ghosted? Nothing has happened on these for ${cfg.ghosted_days}+ days:\n\n${names}`)) return;
  try {
    for (const a of list) await api("PATCH", `/api/applications/${a.id}`, { status: "Ghosted" });
    await reload(); renderMain();
    toast(`Marked ${plural(list.length, "application")} as Ghosted`, "", { label: "Undo", fn: async () => {
      for (const a of list) await api("PATCH", `/api/applications/${a.id}`, { status: a.status });
      await reload(); renderMain();
      toast("Undone");
    } });
  } catch (err) { await reload(); renderMain(); toast(err.message, "error"); }
}

function reminderRow(it) {
  const c = S.co.get(it.cid), n = daysSince(it.date);
  return `<div class="remind ${it.kind}" data-open="${it.cid}" data-open-app="${it.appId || ""}">
    <div class="when"><b>${fmtDate(it.date, { weekday: true })}${it.time ? " · " + fmtTime(it.time) : ""}</b><span>${ago(n)}</span></div>
    <div class="what"><b>${esc(c.name)}</b> <span class="k" style="--c:${kindColor(it.kind)}">${esc(kindLabel(it.kind))}</span><br><span class="muted">${esc(it.body)}</span></div>
    ${it.kind === "interview" ? `<button class="btn small" data-brief="${it.cid}" data-brief-app="${it.appId || ""}">Brief</button>` : "<span></span>"}
  </div>`;
}

function weeklyChart() {
  const today = dayNum(S.data.today), thisWeek = weekStart(today), weeks = 12;
  const counts = new Array(weeks).fill(0);
  for (const a of S.data.applications) {
    if (!a.date_applied) continue;
    const i = weeks - 1 - (thisWeek - weekStart(dayNum(a.date_applied))) / 7;
    if (i >= 0 && i < weeks) counts[i]++;
  }
  if (!counts.some(Boolean)) return `<p class="empty-note">No applications in the last 12 weeks.</p>`;
  const top = niceCeil(Math.max(...counts));
  const lines = [top, top / 2].filter(v => Number.isInteger(v) && v > 0)
    .map(v => `<div class="grid" style="bottom:${100 * v / top}%"><span>${v}</span></div>`).join("");
  const start = i => thisWeek - (weeks - 1 - i) * 7;
  const cols = counts.map((n, i) => `<div class="col ${i === weeks - 1 ? "now" : ""}" data-tip="${i === weeks - 1 ? "This week" : "Week of " + fmtDate(dayStr(start(i)))}: ${plural(n, "application")}">
      <div class="bar" style="height:${100 * n / top}%"></div></div>`).join("");
  const labels = counts.map((_, i) => `<span>${(weeks - 1 - i) % 3 ? "" : i === weeks - 1 ? "This week" : fmtDate(dayStr(start(i)))}</span>`).join("");
  return `<div class="bars" role="img" aria-label="Applications per week: ${counts.join(", ")}">${lines}${cols}</div><div class="bar-x">${labels}</div>`;
}

function statusDonut() {
  const cfg = S.data.config, apps = S.data.applications;
  if (!apps.length) return `<p class="empty-note">No applications yet.</p>`;
  const counts = new Map();
  for (const a of apps) {
    const key = cfg.statuses.includes(a.status) ? a.status : "";
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  const rows = [...cfg.statuses, ""].filter(s => counts.get(s)).map(s => ({ s, n: counts.get(s), label: s || "Other / none", color: s ? seriesColor(s) : "var(--series-none)" }));
  const R = 60, C = 2 * Math.PI * R, gap = rows.length > 1 ? 2 : 0;
  let offset = 0;
  const segs = rows.map(r => {
    const len = C * r.n / apps.length;
    const seg = `<circle class="seg" r="${R}" cx="85" cy="85" stroke="${r.color}" stroke-dasharray="${Math.max(len - gap, .5)} ${C}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 85 85)" data-tip="${esc(r.label)}: ${r.n} (${pct(r.n, apps.length)}%)"></circle>`;
    offset += len;
    return seg;
  }).join("");
  const legend = rows.map(r => `<i style="--c:${r.color}"></i>${r.s ? `<button data-legend-status="${esc(r.s)}">${esc(r.label)}</button>` : `<span>${esc(r.label)}</span>`}<b>${r.n}</b><span class="muted">${pct(r.n, apps.length)}%</span>`).join("");
  return `<div class="donut-wrap">
    <svg class="donut" viewBox="0 0 170 170" role="img" aria-label="Applications by status">${segs}
      <text x="85" y="84" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="-1.5">${apps.length}</text>
      <text x="85" y="104" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--muted)">applications</text></svg>
    <div class="legend">${legend}</div></div>`;
}

function toolBars() {
  const counts = new Map();
  for (const a of S.data.applications) for (const t of splitTools(a.tools)) {
    const k = t.toLowerCase();
    const cur = counts.get(k) || { t, n: 0 };
    cur.n++; counts.set(k, cur);
  }
  const top = [...counts.values()].sort((a, b) => b.n - a.n || a.t.localeCompare(b.t)).slice(0, 8);
  if (!top.length) return `<p class="empty-note">Add tools to your applications to see which come up most.</p>`;
  const max = top[0].n, total = S.data.applications.length;
  return `<div class="hbars">${top.map(x => `<span class="lbl" title="${esc(x.t)}">${esc(x.t)}</span>
    <div class="track" data-tip="${esc(x.t)}: in ${x.n} of ${plural(total, "application")}"><div class="fill" style="width:${Math.max(85 * x.n / max, 1)}%"></div><span>${x.n}</span></div>`).join("")}</div>`;
}

// ---------- calendar ---------------------------------------------------------------------------

function shiftMonth(n) {
  const [y, m] = S.cal.split("-").map(Number);
  S.cal = new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7);
  renderCalendar();
}

function renderCalendar() {
  const today = S.data.today;
  if (!S.cal) S.cal = today.slice(0, 7);
  const [y, m] = S.cal.split("-").map(Number);
  const first = Date.UTC(y, m - 1, 1) / 864e5, last = Date.UTC(y, m, 1) / 864e5 - 1;
  const start = weekStart(first), end = weekStart(last) + 6;
  const items = calItems(dayStr(start), dayStr(end));
  const byDay = new Map();
  for (const it of items) { if (!byDay.has(it.date)) byDay.set(it.date, []); byDay.get(it.date).push(it); }
  const title = new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const dows = [...Array(7)].map((_, i) => new Date(Date.UTC(2024, 0, 1 + i)).toLocaleDateString(undefined, { weekday: "short", timeZone: "UTC" }));
  const chip = it => {
    const name = S.co.get(it.cid)?.name || "";
    const past = it.date < today || (it.date === today && it.time && !isUpcoming(it.ev || it));
    const full = `${it.time ? fmtTime(it.time) + " · " : ""}${kindLabel(it.kind)} · ${name}${it.ev?.remind ? " · reminder set" : ""}${it.body ? "\n" + it.body : ""}`;
    const target = it.ev ? `data-cal-ev="${it.ev.id}"` : `data-cal-join="${it.appId}" data-cid="${it.cid}"`;
    return `<button class="cev ${it.kind} ${past ? "past" : ""} ${it.ev?.remind ? "rem" : ""}" style="--c:${kindColor(it.kind)}" ${target} title="${esc(full)}">
      <b>${it.time ? fmtTime(it.time) + " " : ""}${esc(name)}</b><span>${esc(kindLabel(it.kind))}${it.body ? " · " + esc(it.body) : ""}</span></button>`;
  };
  let cells = "";
  for (let n = start; n <= end; n++) {
    const ds = dayStr(n), list = byDay.get(ds) || [];
    cells += `<div class="cal-day ${n < first || n > last ? "out" : ""} ${ds === today ? "today" : ""}" data-day="${ds}" title="Add an event on ${esc(fmtDate(ds, { weekday: true, year: true }))}">
      <span class="cal-num">${+ds.slice(8)}</span>${list.map(chip).join("")}</div>`;
  }
  const month = items.filter(it => it.date >= dayStr(first) && it.date <= dayStr(last));
  $("#calendar").innerHTML = `
    <div class="cal-head">
      <h2>${esc(title)}</h2>
      <button class="btn small" data-cal="-1" title="Previous month (←)">‹</button>
      <button class="btn small" data-cal="0">Today</button>
      <button class="btn small" data-cal="1" title="Next month (→)">›</button>
      <button class="btn primary" data-cal-add>+ Add event <kbd>n</kbd></button>
    </div>
    <div class="cal-grid">${dows.map(d => `<div class="cal-dow">${esc(d)}</div>`).join("")}${cells}</div>
    <div class="cal-legend">${["interview", "onboarding", "call", "email", "note", "joining"].map(k => `<span style="--c:${k === "interview" ? "var(--accent)" : kindColor(k)}">${kindLabel(k)}</span>`).join("")}
      <span class="rem-key">Reminder set</span>
      <span class="muted" style="margin-left:auto">Click a day to add an event</span></div>
    <div class="cal-agenda upcoming">${month.length ? `<h2>This month</h2>` + month.map(reminderRow).join("") : ""}</div>`;
}

// Add or edit one dated event (interview, onboarding, call…) from anywhere.
function openEventForm({ id, date, cid } = {}) {
  const ev = id ? findRow("events", id) : null;
  const co = S.co.get(ev ? ev.company_id : cid);
  const kinds = Object.entries(KINDS).filter(([k]) => !["status", "applied"].includes(k));
  const kind = ev?.kind || "interview";
  const m = openModal(`
    <h2>${ev ? "Edit event" : "New event"}</h2>
    <form id="evf" autocomplete="off">
      <div class="grid2">
        ${fld("Company", `<input type="text" name="name" list="co-list" required value="${esc(co?.name || "")}" ${ev ? "disabled" : ""}>`)}
        ${fld("For", `<select name="app"></select>`)}
      </div>
      <div class="cohint" id="evf-hint"></div>
      <div class="grid3">
        ${fld("What", `<select name="kind">${kinds.map(([k, l]) => `<option value="${k}" ${k === kind ? "selected" : ""}>${l}</option>`).join("")}</select>`)}
        ${fld("Date", `<input type="date" name="date" required value="${esc(ev?.event_date || date || "")}">`)}
        ${fld("Time", `<input type="time" name="time" value="${esc(ev?.event_time || "")}">`)}
      </div>
      ${fld("Details", `<textarea name="body" rows="2" placeholder="e.g. Technical round with Sam, Zoom link in the invite">${esc(ev?.body || "")}</textarea>`)}
      <div class="checks">${checkbox("remind", ev ? ev.remind : remindByDefault(kind), `Set reminder <span class="muted">(shows in Coming up and the dashboard's next ${S.data.config.reminder_days} days)</span>`)}</div>
      <div class="actions">
        ${ev ? `<button type="button" class="btn danger" id="evf-del" style="margin-right:auto">Delete</button><button type="button" class="btn" id="evf-open">Open company</button>` : ""}
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save <kbd>Ctrl+Enter</kbd></button>
      </div>
    </form>`);
  const form = $("#evf", m), F = form.elements, hint = $("#evf-hint", m);
  const findCo = () => S.data.companies.find(c => c.name.toLowerCase() === F.name.value.trim().toLowerCase());
  const syncApps = () => {
    const c = ev ? co : findCo();
    const apps = c ? coApps(c.id).slice().sort((a, b) => (b.date_applied || "").localeCompare(a.date_applied || "") || b.id - a.id) : [];
    const pick = ev ? ev.application_id : (apps.find(isActive) || apps[0])?.id;
    F.app.innerHTML = `<option value="">Whole company</option>` + apps.map(a => `<option value="${a.id}" ${a.id === pick ? "selected" : ""}>${esc(a.position || "Untitled")}${a.status ? " · " + esc(a.status) : ""}</option>`).join("");
    hint.innerHTML = ev || !F.name.value.trim() ? "" : c ? "" : `<b>${esc(F.name.value.trim())}</b> isn't tracked yet. Pick one from the list, or add the company first.`;
  };
  F.name.addEventListener("input", syncApps);
  syncApps();
  followKind(F.kind, F.remind);

  const save = async () => {
    const name = F.name.value.trim();
    if (!ev && !name) { F.name.focus(); return toast("Which company is it with?", "error"); }
    if (!ev && !findCo()) { F.name.focus(); return toast(`${name} isn't tracked yet. Add the company first.`, "error"); }
    if (!F.date.value) { F.date.focus(); return toast("Pick a date", "error"); }
    const body = { application_id: F.app.value ? +F.app.value : null, kind: F.kind.value, body: F.body.value, event_date: F.date.value, event_time: F.time.value, remind: F.remind.checked };
    try {
      if (ev) await api("PATCH", `/api/events/${ev.id}`, body);
      else {
        await api("POST", "/api/events", { ...body, company_id: findCo().id });
      }
      closeModal();
      if (S.view === "calendar") S.cal = F.date.value.slice(0, 7);
      await reload(); renderMain();
      if (S.open) renderDrawer(true);
      toast(`${kindLabel(body.kind)} ${ev ? "saved" : "added"}: ${fmtDate(body.event_date, { weekday: true })}${body.event_time ? " at " + fmtTime(body.event_time) : ""}`);
    } catch (err) { toast(err.message, "error"); }
  };
  form.addEventListener("submit", e => { e.preventDefault(); save(); });
  form.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } });
  $("[data-close]", m).onclick = closeModal;
  if (ev) {
    $("#evf-open", m).onclick = () => { closeModal(); openDrawer(ev.company_id, ev.application_id); };
    $("#evf-del", m).onclick = async () => {
      if (!confirm("Delete this event?")) return;
      try {
        await api("DELETE", `/api/events/${ev.id}`);
        closeModal(); await reload(); renderMain();
        if (S.open) renderDrawer(true);
        toast("Deleted");
      } catch (err) { toast(err.message, "error"); }
    };
    F.date.focus();
  } else (co ? F.date : F.name).focus();
}

// ---------- drawer -----------------------------------------------------------------------------

const fld = (label, html) => `<label class="fld"><span>${label}</span>${html}</label>`;

function openDrawer(cid, appId) {
  S.open = { cid, appId, fresh: true };
  $("#drawer").hidden = false;
  renderDrawer();
}
function closeDrawer() {
  if (document.activeElement && $("#drawer").contains(document.activeElement)) document.activeElement.blur();
  S.open = null;
  $("#drawer").hidden = true;
}

// The panel shows everything as text. Edit turns one part into a form (S.open.edit says which:
// "company", "app:<id>", "app:new", "person:<id>" or "person:new"); Save or Cancel turns it back.
function renderDrawer(keepScroll) {
  const drawer = $("#drawer");
  const { cid, appId, edit } = S.open;
  const c = S.co.get(cid);
  if (!c) return closeDrawer();
  const scroll = keepScroll ? $(".dbody", drawer)?.scrollTop || 0 : 0;
  const draft = keepScroll ? logDraft() : null;
  const formDraft = keepScroll ? editDraft() : null;
  const apps = coApps(cid).slice().sort((a, b) => (b.date_applied || "").localeCompare(a.date_applied || "") || b.id - a.id);
  const people = S.peopleBy.get(cid) || [];
  const next = upcomingFor(cid)[0];

  drawer.innerHTML = `
  <div class="dh">
    <h2 class="dtitle">${esc(c.name)}</h2>
    <button class="btn" data-act="brief" title="Summary image for interview prep">Brief <kbd>b</kbd></button>
    <button class="btn ghost" data-act="close" title="Close (Esc)">✕</button>
  </div>
  <div class="dbody">
    ${next ? `<div class="callout"><b>Coming up ${esc(ago(daysSince(next.event_date)))}:</b> ${fmtDate(next.event_date, { weekday: true })}${next.event_time ? " at " + esc(fmtTime(next.event_time)) : ""}. ${esc(next.body)}</div>` : ""}
    <section class="sec">
      <div class="sech"><h3>About</h3>${edit === "company" ? "" : `<button class="btn small" data-act="edit" data-edit="company">Edit</button>`}</div>
      ${edit === "company" ? companyForm(c) : companyView(c)}
    </section>
    <section class="sec">
      <div class="sech"><h3>Applications (${apps.length})</h3><button class="btn small" data-act="edit" data-edit="app:new">+ Add application</button></div>
      ${edit === "app:new" ? appForm(null) : ""}
      ${apps.map(a => edit === `app:${a.id}` ? appForm(a) : appCard(a, a.id === appId)).join("") || (edit === "app:new" ? "" : `<p class="empty-note">Not applied yet.</p>`)}
    </section>
    <section class="sec">
      <div class="sech"><h3>People (${people.length})</h3><button class="btn small" data-act="edit" data-edit="person:new">+ Add person</button></div>
      ${edit === "person:new" ? personForm(null) : ""}
      ${people.length ? `<div class="pcards">${people.map(p => edit === `person:${p.id}` ? personForm(p) : personCard(p)).join("")}</div>`
        : edit === "person:new" ? "" : `<p class="empty-note">Recruiters, interviewers, referrers. They show up on the brief.</p>`}
    </section>
    <section class="sec">
      <div class="sech"><h3>Log</h3></div>
      ${logForm(apps, appId)}
      ${timeline(cid, apps)}
    </section>
    <div class="danger-zone"><button class="btn small danger" data-act="del-company">Delete company</button></div>
  </div>`;

  $$("textarea", drawer).forEach(autosize);
  if ($("#log-kind")) followKind($("#log-kind"), $("#log-remind"));
  if (draft) restoreLogDraft(draft);
  if (formDraft && formDraft.key === edit) restoreEditDraft(formDraft);
  const body = $(".dbody", drawer);
  if (keepScroll) body.scrollTop = scroll;
  else if (S.open.fresh && appId) $(`.card[data-app="${appId}"]`, drawer)?.scrollIntoView({ block: "nearest" });
  S.open.fresh = false;
}

// A labelled block of plain text, left out when empty.
const ro = (label, text) => text ? `<div class="ro"><span>${label}</span><p>${esc(text)}</p></div>` : "";
// Items for a .metaline; each is wrapped so flex layout keeps its inner spacing.
const metaline = items => items.length ? `<div class="metaline">${items.map(x => `<span>${x}</span>`).join("<i>·</i>")}</div>` : "";
const extLink = url => url ? `<a class="ext" href="${esc(href(url))}" target="_blank" rel="noopener">${esc(host(href(url)))} ↗</a>` : "";
// A person's link: an email opens your mail app, anything else opens in a new tab.
const personLink = l => !l ? "" : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(l) ? `<a class="ext" href="mailto:${esc(l)}">${esc(l)}</a>` : extLink(l);
const checkbox = (name, on, label) => `<label class="check"><input type="checkbox" name="${name}" ${on ? "checked" : ""}>${label}</label>`;
const formButtons = () => `<div class="eform-f">
  <button type="button" class="btn small" data-act="cancel-edit">Cancel</button>
  <button type="submit" class="btn small primary">Save <kbd>Ctrl+Enter</kbd></button></div>`;

function companyView(c) {
  const meta = [extLink(c.website), c.remote && REMOTE[c.remote], c.is_big_tech && "Big tech", c.urgent && `<b class="flag">★ Urgent</b>`].filter(Boolean);
  const body = ro("What they do", c.about) + ro("References", c.refs) + ro("Notes", c.notes);
  return metaline(meta) +
    (body || `<p class="empty-note">Nothing saved yet. Use Edit to add what they do, references and notes; they show on the brief.</p>`);
}

function companyForm(c) {
  return `<form class="eform" data-edit="company" autocomplete="off">
    ${fld("Name", `<input type="text" name="name" value="${esc(c.name)}" required>`)}
    <div class="grid2">
      ${fld("Website", `<input type="text" name="website" value="${esc(c.website)}" placeholder="company.com">`)}
      ${fld("Remote", `<select name="remote">${Object.entries(REMOTE).map(([v, l]) => `<option value="${v}" ${v === c.remote ? "selected" : ""}>${v ? l : "Not sure"}</option>`).join("")}</select>`)}
    </div>
    <div class="checks">${checkbox("is_big_tech", c.is_big_tech, "Big tech")}${checkbox("urgent", c.urgent, "★ Urgent: apply soon")}</div>

    ${fld("References", `<textarea name="refs" rows="1" placeholder="Who referred you, who you know there">${esc(c.refs)}</textarea>`)}

}

function appCard(a, highlight) {
  const meta = [
    a.date_applied ? `Applied ${fmtDate(a.date_applied)} <span class="muted">(${ago(daysSince(a.date_applied))})</span>` : "Not applied yet",
    a.offer && `Offer: <b>${esc(a.offer)}</b>`,
    a.joining_date && `Joining ${fmtDate(a.joining_date, { weekday: true })}`,

    <div class="card-h"><h4>${esc(a.position || "Untitled role")}</h4>${statusSelect(a)}</div>
    ${metaline(meta)}
    ${splitTools(a.tools).length ? `<div class="tools">${toolChips(a.tools)}</div>` : ""}

function appForm(a) {
