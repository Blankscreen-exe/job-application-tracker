      ${fld("Position", `<input type="text" name="position" value="${esc(v.position)}" placeholder="e.g. Backend Engineer">`)}
      ${fld("Status", `<select name="status">${statusOptions(v.status)}</select>`)}
    </div>
    ${fld("Job post", `<input type="url" name="job_url" value="${esc(v.job_url)}" placeholder="https://…">`)}
    <div class="grid3">
      ${fld("Date applied", `<input type="date" name="date_applied" value="${esc(v.date_applied)}">`)}
      ${fld("Offer", `<input type="text" name="offer" value="${esc(v.offer)}" placeholder="Salary, terms">`)}
      ${fld("Joining date", `<input type="date" name="joining_date" value="${esc(v.joining_date)}">`)}

    ${fld("Tools", `<input type="text" name="tools" value="${esc(v.tools)}" placeholder="Python, AWS, Figma">`)}

const toldRow = r => `<div class="told-row">
  <input type="text" name="told_label" list="told-labels" value="${esc(r.label)}" placeholder="e.g. Salary">
  <input type="text" name="told_value" value="${esc(r.value)}" placeholder="e.g. will discuss in interview">
  <button type="button" class="btn small ghost" data-act="told-del" title="Remove row">✕</button></div>`;
const toldView = rows => rows?.length ? `<div class="ro"><span>What I told them</span><dl class="told">${rows.map(r =>
  `<dt>${esc(r.label || "—")}</dt><dd>${esc(r.value)}</dd>`).join("")}</dl></div>` : "";
// The told rows of a form, skipping empty ones.
const toldRows = form => $$(".told-row", form).map(row => ({ label: $("[name=told_label]", row).value.trim(), value: $("[name=told_value]", row).value.trim() }))
  .filter(r => r.label || r.value);

function personCard(p) {
  return `<div class="pcard">
    <div class="pcard-h"><b>${esc(p.name || "Unnamed")}</b>
      <span class="pcard-a"><button class="btn small ghost" data-act="edit" data-edit="person:${p.id}">Edit</button><button class="btn small ghost danger" data-act="del-person" data-id="${p.id}">Delete</button></span></div>
    ${p.role ? `<div class="muted">${esc(p.role)}</div>` : ""}
    ${p.link ? `<div>${personLink(p.link)}</div>` : ""}
    ${p.notes ? `<p>${esc(p.notes)}</p>` : ""}
  </div>`;
}

function personForm(p) {
  const v = p || { name: "", role: "", link: "", notes: "" };
  return `<form class="eform person-form" data-edit="${p ? `person:${p.id}` : "person:new"}" autocomplete="off">
    <div class="grid3">
      ${fld("Name *", `<input type="text" name="name" value="${esc(v.name)}" required>`)}
      ${fld("Role", `<input type="text" name="role" value="${esc(v.role)}" placeholder="e.g. Hiring manager">`)}
      ${fld("Link", `<input type="text" name="link" value="${esc(v.link)}" placeholder="LinkedIn or email">`)}
    </div>
    ${fld("Notes", `<textarea name="notes" rows="2" placeholder="What to remember about them">${esc(v.notes)}</textarea>`)}
    ${formButtons()}

// A form's named fields as an object; label/value rows become a `told` list.
function formData(form) {
  const data = {};
  for (const el of form.elements) {
    if (el.name && !el.name.startsWith("told_")) data[el.name] = el.type === "checkbox" ? el.checked : el.value;
  }
  if ($(".told-rows", form)) data.told = toldRows(form);
  return data;
}

// Keep what's typed into an open form when the panel redraws (e.g. after a status change).
function editDraft() {
  const f = $("#drawer .eform");
  return f ? { key: f.dataset.edit, data: formData(f) } : null;
}
function restoreEditDraft(d) {
  const f = $("#drawer .eform");
  if (!f) return;
  for (const [name, value] of Object.entries(d.data)) {

  const past = items.filter(e => !future.includes(e)).sort((x, y) => (y.when + (y.event_time || "")).localeCompare(x.when + (x.event_time || "")) || (y.created_at || "").localeCompare(x.created_at || ""));

async function drawerAction(act, el) {
  const cid = S.open?.cid;
  const refresh = async () => { await reload(); renderMain(); renderDrawer(true); };
  try {
    switch (act) {
      case "close": return closeDrawer();
      case "brief": return openBrief(cid, S.open.appId);
      case "edit": return openEdit(el.dataset.edit);
      case "cancel-edit": return cancelEdit();
      case "told-add": {
        const rows = el.closest(".fld").querySelector(".told-rows");

        if (!confirm("Delete this application? Its log entries stay with the company.")) return;
        await api("DELETE", `/api/applications/${el.dataset.id}`);
        return refresh();
      case "del-person": {
        const person = findRow("contacts", +el.dataset.id);
        if (!confirm(`Remove ${person?.name || "this person"}?`)) return;
        await api("DELETE", `/api/contacts/${el.dataset.id}`);

function toast(msg, type = "", action) {
  const t = document.createElement("div");
  t.className = "toast " + type;

  if (action) {

}

const JOB_BOARDS = /(^|\.)(linkedin|indeed|glassdoor|monster|ziprecruiter|remoteok|weworkremotely|otta|welcometothejungle|builtin|dice|simplyhired|naukri|rozee|bayt|seek|stepstone|xing|remotive|jobs\.github)\./;
const SUBDOMAIN_ATS = /\.(recruitee\.com|bamboohr\.com|teamtailor\.com|breezy\.hr|personio\.(de|com)|applytojob\.com|freshteam\.com|pinpointhq\.com|zohorecruit\.com|rippling-ats\.com|join\.com)$/;
const PATH_ATS = [
  [/(^|\.)greenhouse\.io$/, (u, seg) => seg[0] === "embed" ? u.searchParams.get("for") : seg[0]],
  [/^jobs\.(lever\.co|ashbyhq\.com|smartrecruiters\.com|jobvite\.com)$/, (u, seg) => seg[0]],
  [/^(apply\.)?workable\.com$/, (u, seg) => seg[0] === "j" ? null : seg[0]],
  [/^(wellfound\.com|angel\.co)$/, (u, seg) => seg[0] === "company" ? seg[1] : null],
  [/^ycombinator\.com$/, (u, seg) => seg[0] === "companies" ? seg[1] : null],
  [/^join\.com$/, (u, seg) => seg[0] === "companies" ? seg[1] : null],
];
const titleCase = s => s.replace(/[-_.]+/g, " ").replace(/\s+/g, " ").trim().replace(/\b\w/g, c => c.toUpperCase());

function guessFromUrl(raw) {
  let u;
  try { u = new URL(/^https?:\/\//i.test(raw.trim()) ? raw.trim() : "https://" + raw.trim()); } catch { return null; }
  if (!u.hostname.includes(".")) return null;
  const h = u.hostname.toLowerCase().replace(/^www\./, "");
  const seg = u.pathname.split("/").filter(Boolean);
  for (const [re, fn] of PATH_ATS) if (re.test(h)) { const slug = fn(u, seg); return slug ? { name: titleCase(slug), website: "" } : null; }
  if (SUBDOMAIN_ATS.test(h) || /myworkdayjobs\.com$/.test(h)) {
    const sub = h.split(".")[0];
    return /^wd\d+$/.test(sub) ? null : { name: titleCase(sub), website: "" };
  }
  if (JOB_BOARDS.test("." + h)) return null;
  const labels = h.split(".");
  let n = 2;
  if (labels.length >= 3 && labels.at(-1).length === 2 && ["co", "com", "org", "net", "ac", "gov", "edu"].includes(labels.at(-2))) n = 3;
  const domain = labels.slice(-n).join(".");
  return { name: titleCase(labels.at(-n)), website: "https://" + domain };
}

function popularTools() {
  const counts = new Map();
  for (const a of S.data.applications) for (const t of splitTools(a.tools)) counts.set(t, (counts.get(t) || 0) + 1);

}

// Job links compared loosely: no scheme, www, tracking parameters, fragment or trailing slash.
function normUrl(url) {
  const raw = (url || "").trim();
  if (!raw) return "";
  try {
    const u = new URL(/^https?:\/\//i.test(raw) ? raw : "https://" + raw);
    for (const k of [...u.searchParams.keys()]) if (/^(utm_|ref$|source$|src$|trk)/i.test(k)) u.searchParams.delete(k);
    return (u.hostname.replace(/^www\./, "") + u.pathname.replace(/\/+$/, "") + (u.searchParams.toString() ? "?" + u.searchParams : "")).toLowerCase();
  } catch { return raw.toLowerCase(); }
}
const findDuplicate = (url, exceptId = null) => {
  const n = normUrl(url);
  return n ? S.data.applications.find(a => a.id !== exceptId && normUrl(a.job_url) === n) : null;
};
const describeApp = a => `${S.co.get(a.company_id).name} · ${a.position || "Untitled"}${a.date_applied ? `, applied ${fmtDate(a.date_applied)}` : ""}${a.status ? ` (${a.status})` : ""}`;
function confirmNotDuplicate(url, exceptId = null) {
  const dup = findDuplicate(url, exceptId);
  return !dup || confirm(`You already saved this job link:\n${describeApp(dup)}\n\nSave anyway?`);
}

      ${fld("What they do", `<textarea name="about" rows="2" placeholder="Products, customers, size. Shows on the brief."></textarea>`)}
      ${fld("Notes", `<textarea name="notes" rows="2"></textarea>`)}
      <p class="muted" style="font-size:12px;margin:0">Already applied? <a href="#" id="cf-app">Add an application instead</a>.</p>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="button" class="btn" id="cf-another">Save &amp; add another</button>
        <button type="submit" class="btn primary">Save <kbd>Ctrl+Enter</kbd></button>
      </div>
    </form>`);
  const form = $("#cf", m), F = form.elements, hint = $("#cf-hint", m);
  const existing = () => S.data.companies.find(c => c.name.toLowerCase() === F.name.value.trim().toLowerCase());
  F.name.addEventListener("input", () => {
    const ex = existing();
    hint.innerHTML = ex ? `<b>${esc(ex.name)}</b> is already tracked. <a href="#" id="cf-open">Open it</a>` : "";
  });
  hint.addEventListener("click", e => {
    if (!e.target.closest("#cf-open")) return;
    e.preventDefault();
    const ex = existing();
    closeModal();
    if (ex) openDrawer(ex.id);
  });
  $("#cf-app", m).onclick = e => { e.preventDefault(); const name = F.name.value.trim(); closeModal(); openQuickAdd(name ? { name } : {}); };

  const save = async (another) => {
    if (!F.name.value.trim()) { F.name.focus(); return toast("Company name is needed", "error"); }
    try {
      const row = await api("POST", "/api/companies", {
        name: F.name.value, website: F.website.value, remote: F.remote.value,
        is_big_tech: F.is_big_tech.checked, urgent: F.urgent.checked, about: F.about.value, notes: F.notes.value,
      });
      await reload(); renderMain();
      toast(`Saved ${row.name}`, "", { label: "Open", fn: () => openDrawer(row.id) });
      if (another) { form.reset(); hint.innerHTML = ""; F.name.focus(); } else closeModal();
    } catch (err) { toast(err.message, "error"); }
  };
  form.addEventListener("submit", e => { e.preventDefault(); save(false); });
  $("#cf-another", m).onclick = () => save(true);
  form.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(e.shiftKey); } });
  $("[data-close]", m).onclick = closeModal;
  F.name.focus();
}

// ----- import

async function runImport(text, order, dry) {
  const res = await fetch(`/api/import?dry=${dry ? 1 : 0}&order=${order}`, { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "text/csv" }, body: text });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function importFile(file) {
  const text = await file.text();
  let order = "auto";
  const show = async () => {
    let r;
    try { r = await runImport(text, order, true); } catch (err) { closeModal(); return toast(err.message, "error"); }
    order = r.date_order;
    const m = openModal(`
      <h2>Import ${esc(file.name)}</h2>
      <p class="muted" style="margin-top:0">Nothing is saved until you press Import. Importing the same file twice won't create duplicates.</p>
      <div class="import-stats">
        <b>${r.rows}</b><span>rows read</span>
        <b>${r.companies_created}</b><span>new companies</span>
        <b>${r.companies_updated}</b><span>existing companies filled in</span>
        <b>${r.applications_created}</b><span>new applications</span>
        <b>${r.duplicates_skipped}</b><span>applications already here (skipped)</span>
        ${r.rows_skipped ? `<b>${r.rows_skipped}</b><span>rows without a company name (skipped)</span>` : ""}
      </div>
      ${fld("Dates like 03/04/2025 are", `<select id="imp-order"><option value="mdy" ${order === "mdy" ? "selected" : ""}>Month / Day / Year (US)</option><option value="dmy" ${order === "dmy" ? "selected" : ""}>Day / Month / Year</option></select>`)}
      ${r.unknown_columns.length ? `<p style="font-size:13px">Columns kept in comments: ${r.unknown_columns.map(esc).join(", ")}</p>` : ""}
      ${r.warnings.length ? `<div class="warnings">${r.warnings.map(w => esc(w)).join("<br>")}</div>` : ""}
      <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="imp-go">Import</button></div>`);
    $("[data-close]", m).onclick = closeModal;

        toast(`Imported ${done.companies_created} companies and ${done.applications_created} applications`);
      } catch (err) { toast(err.message, "error"); }
    };
  };
  show();
}

function openBrief(cid, appId) {
  const c = S.co.get(cid), apps = coApps(cid);
  const chosen = apps.find(a => a.id === appId) || apps.find(isActive) || latestApp(cid);
  const m = openModal(`

      ${apps.length > 1 ? `<select id="brief-app" style="width:auto">${apps.map(a => `<option value="${a.id}" ${a === chosen ? "selected" : ""}>${esc(a.position || "Untitled")}</option>`).join("")}</select>` : ""}
      <button class="btn" id="brief-copy">Copy image</button>
      <button class="btn primary" id="brief-dl">Download PNG</button>
      <button class="btn ghost" data-close>✕</button>
    </div>

    catch { toast("Your browser blocked copying; use Download instead", "error"); }
  }, "image/png");
}

function drawBrief(canvas, cid, appId) {
  const c = S.co.get(cid), apps = coApps(cid);
  const app = apps.find(a => a.id === appId) || latestApp(cid);
  const people = S.peopleBy.get(cid) || [];
  const next = upcomingFor(cid)[0];
  const W = 1000, P = 44, GAP = 26, COLGAP = 32, SCALE = 2, MAXH = 6000;
  const FONT = '"Helvetica Neue", Helvetica, Arial, "Nimbus Sans", "Liberation Sans", sans-serif';
  // The image is always light, whatever the page theme, so it reads the same when shared or printed.
  const C = { bg: "#ffffff", ink: "#000000", muted: "#666666", faint: "#9a9a9a", red: "#e30613" };
  const statusHex = s => ({ Interview: C.red, Offer: C.red, Rejected: C.faint, Ghosted: "#b8b8b8", Withdrawn: "#b8b8b8" }[s] || C.ink);
  const kindHex = k => k === "interview" ? C.red : k === "note" || k === "other" ? C.faint : k === "status" ? C.muted : C.ink;

  const tmp = document.createElement("canvas");
  tmp.width = W * SCALE; tmp.height = MAXH * SCALE;
  const x = tmp.getContext("2d");
  x.scale(SCALE, SCALE);
  x.textBaseline = "top";
  x.fillStyle = C.bg; x.fillRect(0, 0, W, MAXH);
  const font = (size, weight = 400, ls = 0) => {
    x.font = `${weight} ${size}px ${FONT}`;
    if ("letterSpacing" in x) x.letterSpacing = `${ls}px`;
  };

  const lines = (str, w, max) => {
    const out = [];
    for (const para of String(str || "").split("\n")) {
      if (!para.trim()) { if (out.length && out.at(-1) !== "") out.push(""); continue; }
      let line = "";
      for (const word of para.trim().split(/\s+/)) {
        const test = line ? line + " " + word : word;
        if (x.measureText(test).width <= w) { line = test; continue; }
        if (line) out.push(line);
        line = word;
        while (x.measureText(line).width > w) {
          let i = line.length;
          while (i > 1 && x.measureText(line.slice(0, i)).width > w) i--;
          out.push(line.slice(0, i)); line = line.slice(i);
        }
      }
      if (line) out.push(line);
    }
    while (out.length && out.at(-1) === "") out.pop();
    if (max && out.length > max) {
      out.length = max;
      let l = out[max - 1];
      while (l && x.measureText(l + "…").width > w) l = l.slice(0, -1);
      out[max - 1] = l + "…";
    }
    return out;
  };
  // Every drawing helper takes `dry` first: when true it only measures and returns the height.
  const text = (dry, str, x0, y0, w, o = {}) => {
    const size = o.size || 15; font(size, o.weight || 400, o.ls || 0);
    const ls = lines(str, w, o.max || 0), lh = Math.round(size * (o.lh || 1.4));
    if (!dry) { x.fillStyle = o.color || C.ink; ls.forEach((l, i) => x.fillText(l, x0, y0 + i * lh)); }
    return ls.length * lh;
  };
  // words laid out left to right, wrapping (used for tools)
  const flow = (dry, items, x0, y0, w) => {
    font(16, 700);
    const lh = 24, gap = 20;
    let cx = x0, cy = y0;
    for (const it of items) {
      const tw = Math.min(x.measureText(it).width, w);
      if (cx + tw > x0 + w && cx > x0) { cx = x0; cy += lh; }
      if (!dry) { x.fillStyle = C.ink; x.fillText(lines(it, w, 1)[0] || "", cx, cy); }
      cx += tw + gap;
    }
    return items.length ? cy - y0 + lh : 0;
  };
  // a status square, the status, then muted text after it
  const statusLine = (dry, x0, y0, status, rest, size = 16) => {
    if (!dry) {
      const label = status || "No status";
      x.fillStyle = statusHex(status); x.fillRect(x0, y0 + size * .22, size * .7, size * .7);
      font(size, 700); x.fillText(label, x0 + size * 1.2, y0);
      const lw = x.measureText(label).width;
      if (rest) { font(size, 400); x.fillStyle = C.muted; x.fillText(rest, x0 + size * 1.2 + lw + 12, y0); }
    }
    return Math.round(size * 1.4);
  };
  // a section: a black rule with a bold title under it; or, with `fill`, a solid block
  const section = (dry, x0, y0, w, title, body, o = {}) => {
    if (o.fill) {
      const pad = 20, th = title ? 26 : 0;
      const h = pad * 2 + th + body(true, x0 + pad, y0 + pad + th, w - 2 * pad);
      if (!dry) {
        x.fillStyle = o.fill; x.fillRect(x0, y0, w, h);
        if (title) { font(13, 700); x.fillStyle = o.titleColor || C.ink; x.fillText(title, x0 + pad, y0 + pad); }
        body(false, x0 + pad, y0 + pad + th, w - 2 * pad);
      }
      return h;
    }
    const top = 12, th = title ? 26 : 0;
    const h = top + th + body(true, x0, y0 + top + th, w) + 4;
    if (!dry) {
      x.fillStyle = C.ink; x.fillRect(x0, y0, w, 2);
      if (title) { font(13, 700); x.fillStyle = C.ink; x.fillText(title, x0, y0 + top); }
      body(false, x0, y0 + top + th, w);
    }
    return h;
  };
  // stack: draw several pieces one under another, with gaps
  const stack = parts => (dry, x0, y0, w) => {
    let y = y0;
    parts.filter(Boolean).forEach((p, i) => { if (i) y += p.gap ?? 6; y += p.fn(dry, x0, y, w); });
    return y - y0;
  };
  const T = (str, o) => str ? { fn: (d, x0, y0, w) => text(d, str, x0, y0, w, o), gap: o?.gap } : null;

  // ---- header
  const meta = [c.website && host(c.website), c.is_big_tech && "Big tech", c.remote && REMOTE[c.remote], c.urgent && "★ Urgent"].filter(Boolean).join("   ·   ");
  const header = stack([
    { fn: (d, x0, y0) => {
      if (!d) { x.fillStyle = C.red; x.fillRect(x0, y0, 20, 20); font(13, 700); x.fillStyle = C.ink; x.fillText("Interview brief", x0 + 32, y0 + 4); }
      return 20;
    } },
    T(c.name, { size: 60, weight: 700, max: 2, lh: 1.02, ls: -2.5, gap: 26 }),
    T(meta, { size: 16, color: C.muted, gap: 10 }),
    app && T(app.position || "Untitled role", { size: 26, weight: 700, ls: -.6, gap: 20, max: 2 }),
    app && { fn: (d, x0, y0) => statusLine(d, x0, y0, app.status, app.date_applied ? `Applied ${fmtDate(app.date_applied, { year: true })}, ${ago(daysSince(app.date_applied))}` : "Not applied yet"), gap: 8 },
  ]);
  let y = 40;
  y += header(false, P, y, W - 2 * P);
  font(12, 700); x.fillStyle = C.muted; x.textAlign = "right";
  x.fillText(`Made ${fmtDate(S.data.today, { year: true })}`, W - P, 44);
  x.textAlign = "left";
  y += 26;
  x.fillStyle = C.ink; x.fillRect(P, y, W - 2 * P, 6);
  y += 6 + GAP;

  // ---- next up
  if (next) {
    const when = `${asDate(next.event_date).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}${next.event_time ? ", " + fmtTime(next.event_time) : ""}  (${ago(daysSince(next.event_date))})`;
    y += section(false, P, y, W - 2 * P, "Next up", stack([
      T(when, { size: 26, weight: 700, ls: -.6, color: "#fff" }),
      T(next.body, { size: 17, max: 4, gap: 8, color: "#fff" }),
    ]), { fill: C.red, titleColor: "#fff" }) + GAP;
  }

  // ---- two columns
  const colW = (W - 2 * P - COLGAP) / 2;
  const left = [], right = [];
  if (app) {
    left.push(["The role", stack([
      T(app.position || "Untitled role", { size: 20, weight: 700, ls: -.3 }),
      { fn: (d, x0, y0) => statusLine(d, x0, y0, app.status, app.date_applied ? `applied ${fmtDate(app.date_applied, { year: true })}` : "", 15), gap: 8 },
      app.job_url && T(host(app.job_url), { size: 15, weight: 700, color: C.red, gap: 8 }),
      app.offer && T(`Offer: ${app.offer}`, { size: 16, weight: 700, gap: 12 }),
      app.joining_date && T(`Joining ${fmtDate(app.joining_date, { year: true })}`, { size: 15 }),
      app.resume_id && T(`Resume sent: ${resumeName(app.resume_id)}`, { size: 15, gap: 8 }),
    ])]);
    if (app.told.length) left.push(["What I told them", stack(app.told.map((r, i) => T(r.label ? `${r.label}: ${r.value}` : r.value, { size: 15, max: 3, gap: i ? 6 : 0 })))]);
    const tl = splitTools(app.tools);
    if (tl.length) left.push(["Tools", (d, x0, y0, w) => flow(d, tl, x0, y0, w)]);
    if (app.responsibilities) left.push(["Responsibilities", stack([T(app.responsibilities, { max: 16 })])]);
  }
  if (c.about) right.push(["What they do", stack([T(c.about, { max: 14, size: 16 })])]);
  if (people.length) {
    right.push(["People", stack(people.slice(0, 6).flatMap((p, i) => [
      T(p.name || "Unnamed", { size: 18, weight: 700, ls: -.3, gap: i ? 16 : 0 }),
      T([p.role, p.link].filter(Boolean).join("   ·   "), { size: 13, color: C.muted, gap: 2 }),
      T(p.notes, { size: 15, max: 3, gap: 4 }),
    ]))]);
  }
  if (c.refs) right.push(["References", stack([T(c.refs, { max: 6 })])]);
  const notes = [c.notes, app?.comments].filter(Boolean).join("\n\n");
  if (notes) (left.length <= right.length ? left : right).push(["My notes", stack([T(notes, { max: 14 })])]);
  if (!left.length && !right.length && !next) {
    left.push(["Nothing saved yet", stack([T("Add what they do, the people you'll meet and your notes in the company panel, then open the brief again.", { color: C.muted })])]);
  }
  const drawCol = (blocks, x0, w) => { let cy = y; for (const [title, body] of blocks) cy += section(false, x0, cy, w, title, body) + GAP; return cy; };
  if (!right.length) y = drawCol(left, P, W - 2 * P);
  else if (!left.length) y = drawCol(right, P, W - 2 * P);
  else y = Math.max(drawCol(left, P, colW), drawCol(right, P + colW + COLGAP, colW));

  // ---- recent log
  const items = timelineItems(cid).filter(e => !(e.id && isUpcoming(e)) && e.when <= S.data.today)
    .sort((a, b) => (b.when + (b.event_time || "")).localeCompare(a.when + (a.event_time || ""))).slice(0, 8);
  if (items.length) {
    y += section(false, P, y, W - 2 * P, "Recent history", (d, x0, y0, w) => {
      let cy = y0;
      items.forEach((e, i) => {
        if (i) cy += 12;
        const dateW = 170;
        if (!d) {
          font(14, 700); x.fillStyle = kindHex(e.kind); x.fillText(fmtDate(e.when, { year: true }), x0, cy + 1);
          font(11, 700); x.fillStyle = C.muted; x.fillText(KINDS[e.kind] || e.kind, x0, cy + 20);
        }
        cy += Math.max(36, text(d, e.body || "—", x0 + dateW, cy, w - dateW, { size: 15, max: 3 }));
      });
      return cy - y0;
    }) + GAP;
  }

  x.fillStyle = C.red; x.fillRect(P, y + 2, 10, 10);
  font(12, 700); x.fillStyle = C.ink;
  x.fillText("Job Tracker", P + 18, y);
  const H = Math.min(y + 40, MAXH);

  canvas.width = W * SCALE; canvas.height = H * SCALE;
  canvas.getContext("2d").drawImage(tmp, 0, 0, W * SCALE, H * SCALE, 0, 0, W * SCALE, H * SCALE);
}

// ---------- me: about me, portfolio projects and resumes ---------------------------------------

// S.meEdit says which part of the Me page is a form: "profile", "project:<id>", "project:new" or "resume:<id>".
function renderMe() {
  const p = S.data.profile[0], edit = S.meEdit;
  const projects = S.data.projects.slice().sort((a, b) => a.name.localeCompare(b.name));
  $("#me").innerHTML = `
    <div class="me-head">
      <h2>${esc(p.name || "About me")}</h2>
      <button class="btn primary" data-me="message" title="A prompt for a LinkedIn/Reddit comment or a DM pitch">Write a message</button>
    </div>
    <section class="sec">
      <div class="sech"><h3>About me</h3>${edit === "profile" ? "" : `<button class="btn small" data-me="edit" data-edit="profile">Edit</button>`}</div>
      ${edit === "profile" ? profileForm(p) : profileView(p)}
    </section>
    <section class="sec">
      <div class="sech"><h3>Projects (${projects.length})</h3><span class="sech-a">
        <button class="btn small" data-me="import" title="Columns like Name, Description, Tools, Repo, Demo, Role, Dates, Results">Import CSV</button>
        <button class="btn small" data-me="edit" data-edit="project:new">+ Add project</button></span></div>
      ${edit === "project:new" ? projectForm(null) : ""}
      ${projects.length ? `<div class="projects">${projects.map(pr => edit === `project:${pr.id}` ? projectForm(pr) : projectCard(pr)).join("")}</div>`
        : edit === "project:new" ? "" : `<p class="empty-note">Add the projects you'd point people to; they go into every message and email prompt. Or import a CSV with columns like Name, Description, Tools, Repo, Demo, Role, Dates, Results.</p>`}
    </section>
    ${resumesSection()}`;
  $$("#me textarea").forEach(autosize);
}

// A line from the Links box ("GitHub: github.com/me", "me@mail.com") as a link.
const lineLink = line => {
  const m = line.match(/[^\s@:]+@[^\s@]+\.[^\s@]+|(?:https?:\/\/)?[\w-]+(?:\.[\w-]+)+\S*/);
  return m ? personLink(m[0]) : esc(line);
};
const lines = text => (text || "").split("\n").map(l => l.trim()).filter(Boolean);

function profileView(p) {
  if (!(p.name || p.headline || p.location || p.about || p.skills || p.links)) {
    return `<p class="empty-note">Your name, a one-line headline, a short background, skills and links. It goes at the top of every prompt so the LLM writes as you.</p>`;
  }
  return (p.headline ? `<p class="headline">${esc(p.headline)}</p>` : "") +
    metaline([p.location && esc(p.location), ...lines(p.links).map(lineLink)].filter(Boolean)) +
    ro("Background", p.about) +
    (p.skills ? `<div class="ro"><span>Skills</span><div class="tools">${toolChips(p.skills)}</div></div>` : "");
}

function profileForm(p) {
  return `<form class="eform" data-edit="profile" autocomplete="off">
    <div class="grid3">
      ${fld("Name", `<input type="text" name="name" value="${esc(p.name)}">`)}
      ${fld("Headline", `<input type="text" name="headline" value="${esc(p.headline)}" placeholder="e.g. Backend engineer, 5 years of Python">`)}
      ${fld("Location", `<input type="text" name="location" value="${esc(p.location)}" placeholder="e.g. Lahore, open to remote">`)}
    </div>
    ${fld("Background", `<textarea name="about" rows="4" placeholder="A few lines about your experience, what you're good at and what you're looking for">${esc(p.about)}</textarea>`)}
    ${fld("Skills", `<input type="text" name="skills" value="${esc(p.skills)}" placeholder="Python, Django, AWS, Postgres">`)}

async function uploadResumes(files) {
  const added = [], box = $("#me .dropbox");
  box?.classList.add("busy");
  for (const [i, file] of files.entries()) {
    if (box) box.textContent = `Uploading ${files.length > 1 ? `${i + 1} of ${files.length}: ` : ""}${file.name}…`;
    try {
      const res = await fetch(`/api/resumes/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/octet-stream" }, body: file });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      added.push(data.filename);
    } catch (err) { toast(`${file.name}: ${err.message}`, "error"); }
  }
  if (!added.length) return renderMe();
  await reload(); renderMain();
  toast(added.length === 1 ? `Added ${added[0]}` : `Added ${added.length} resumes`);
}

function openMeEdit(key) {
  S.meEdit = key;
  renderMe();
  const f = $("#me .eform");
  f?.scrollIntoView({ block: "nearest" });
  $("input, textarea", f)?.focus();
}

async function saveMe(form) {
  const [kind, id] = form.dataset.edit.split(":"), data = formData(form);
  if (kind === "project" && !data.name.trim()) { form.elements.name.focus(); return toast("A project needs a name", "error"); }
  try {
    if (kind === "profile") await api("PATCH", "/api/profile/1", data);
    else if (kind === "resume") await api("PATCH", `/api/resumes/${id}`, data);
    else if (id === "new") await api("POST", "/api/projects", data);
    else await api("PATCH", `/api/projects/${id}`, data);
    S.meEdit = null;
    await reload(); renderMain();
    toast("Saved");
  } catch (err) { toast(err.message, "error"); }
}

async function meAction(act, el) {
  try {
    switch (act) {
      case "edit": return openMeEdit(el.dataset.edit);
      case "message": return openPitchPrompt();
      case "import": return $("#file-projects").click();
      case "del-project": {
        const pr = findRow("projects", +el.dataset.id);
        if (!confirm(`Delete the project ${pr.name}?`)) return;
        await api("DELETE", `/api/projects/${pr.id}`);
        await reload(); renderMain();
        return toast(`Deleted ${pr.name}`);
      }
      case "upload": return $("#file-resume").click();
      case "open-folder": return await api("POST", "/api/resumes/open-folder");
      case "reveal": return await api("POST", `/api/resumes/${el.dataset.id}/reveal`);
      case "copy-resume": {
        await api("POST", `/api/resumes/${el.dataset.id}/copy`);
        return toast(`Copied ${resumeName(+el.dataset.id)}. Paste it into an upload box, or into a file picker's File name box`);
      }
      case "del-resume": {
        const r = findRow("resumes", +el.dataset.id), used = S.data.applications.filter(a => a.resume_id === r.id).length;
        const note = r.missing ? "" : " The file is moved to resumes/removed, not erased.";
        if (!confirm(`Delete ${r.label || r.filename}?${note}${used ? ` ${plural(used, "application")} will no longer show which resume was sent.` : ""}`)) return;
        await api("DELETE", `/api/resumes/${r.id}`);
        await reload(); renderMain();
        return toast(`Deleted ${r.label || r.filename}`);
      }
    }
  } catch (err) { toast(err.message, "error"); }
}

async function importProjects(file) {
  const text = await file.text();
  const run = dry => fetch(`/api/import-projects?dry=${dry ? 1 : 0}`, { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "text/csv" }, body: text })
    .then(async res => { const data = await res.json().catch(() => ({})); if (!res.ok) throw new Error(data.error || res.statusText); return data; });
  let r;
  try { r = await run(true); } catch (err) { return toast(err.message, "error"); }
  const m = openModal(`
    <h2>Import ${esc(file.name)}</h2>
    <p class="muted" style="margin-top:0">Nothing is saved until you press Import. A project with the same name as one you have is updated, not duplicated.</p>
    <div class="import-stats">
      <b>${r.rows}</b><span>rows read</span>
      <b>${r.created}</b><span>new projects</span>
      <b>${r.updated}</b><span>existing projects updated</span>
      ${r.rows_skipped ? `<b>${r.rows_skipped}</b><span>rows without a name (skipped)</span>` : ""}
    </div>
    ${r.unknown_columns.length ? `<p style="font-size:13px">Columns added to the description: ${r.unknown_columns.map(esc).join(", ")}</p>` : ""}
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pimp-go">Import</button></div>`);
  $("[data-close]", m).onclick = closeModal;
  $("#pimp-go", m).onclick = async () => {
    try {
      const done = await run(false);
      closeModal();
      await reload(); renderMain();
      toast(`Imported ${plural(done.created, "new project")}${done.updated ? `, updated ${done.updated}` : ""}`);
    } catch (err) { toast(err.message, "error"); }
  };
}

// Nothing is sent anywhere: these build a prompt you copy into ChatGPT, Claude, Gemini or similar.

const oneLine = t => (t || "").replace(/\s*\n+\s*/g, " ").trim();
const section = (title, body) => body ? `## ${title}\n${body}` : "";

function aboutMeBlock() {
  const p = S.data.profile[0];
  const rows = [
    p.name && `Name: ${p.name}`, p.headline && `Headline: ${p.headline}`, p.location && `Location: ${p.location}`,
    p.skills && `Skills: ${p.skills}`, p.links && `Links: ${lines(p.links).join(", ")}`, p.about && `Background: ${p.about.trim()}`,
  ].filter(Boolean);
  return section("About me", rows.join("\n") || "(Not filled in: write [my name] where my name goes and keep claims about me general.)");
}

function projectsBlock() {
  return section("My projects", S.data.projects.map(pr => [
    `- ${pr.name}${[pr.dates, pr.role].some(Boolean) ? ` (${[pr.dates, pr.role].filter(Boolean).join("; ")})` : ""}${pr.description ? `: ${oneLine(pr.description)}` : ""}`,
    pr.tools && `  Tools: ${pr.tools}`, pr.results && `  Results: ${oneLine(pr.results)}`,
    (pr.repo_url || pr.demo_url) && `  Links: ${[pr.repo_url, pr.demo_url].filter(Boolean).join(", ")}`,
  ].filter(Boolean).join("\n")).join("\n"));
}

function jobBlock(a) {
  const c = S.co.get(a.company_id), people = S.peopleBy.get(c.id) || [];
  const history = timelineItems(c.id).filter(e => !e.application_id || e.application_id === a.id)
    .sort((x, y) => (x.when + (x.event_time || "")).localeCompare(y.when + (y.event_time || ""))).slice(-20)
    .map(e => `- ${e.when}${e.event_time ? " " + fmtTime(e.event_time) : ""} · ${kindLabel(e.kind)}${e.when > S.data.today ? " (upcoming)" : ""}: ${oneLine(e.body) || "—"}`);
  return [
    section(`The company: ${c.name}`, [c.website && `Website: ${c.website}`, c.about && `What they do: ${oneLine(c.about)}`,
      c.refs && `Referral / who I know there: ${oneLine(c.refs)}`, c.notes && `My notes on them: ${oneLine(c.notes)}`].filter(Boolean).join("\n") || "(no details saved)"),
    section(`The role: ${a.position || "untitled"}`, [a.status && `Status: ${a.status}`,
      a.date_applied && `Applied: ${fmtDate(a.date_applied, { year: true })} (${ago(daysSince(a.date_applied))})`,
      a.job_url && `Job post: ${a.job_url}`, a.tools && `Tools they want: ${a.tools}`,
      a.responsibilities && `Responsibilities: ${oneLine(a.responsibilities)}`, a.offer && `Offer: ${a.offer}`,
      a.joining_date && `Joining date: ${fmtDate(a.joining_date, { year: true })}`, a.resume_id && `Resume I sent: ${resumeName(a.resume_id)}`,
      a.comments && `My comments: ${oneLine(a.comments)}`].filter(Boolean).join("\n")),
    section("What I've already told them (stay consistent with this)", a.told.map(r => `- ${r.label ? r.label + ": " : ""}${r.value}`).join("\n")),
    section("People there", people.map(p => `- ${p.name}${p.role ? ` (${p.role})` : ""}${p.link ? `, ${p.link}` : ""}${p.notes ? `: ${oneLine(p.notes)}` : ""}`).join("\n")),
    section("History so far (oldest first)", history.join("\n")),
  ].filter(Boolean).join("\n\n");
}

const EMAIL_TYPES = {
  followup: { label: "Follow-up after applying", extra: "Anything to mention (optional)", ph: "e.g. I just shipped a project that uses their stack" },
  thanks: { label: "Thank-you after an interview", extra: "What stood out in the interview (optional)", ph: "e.g. we talked about their move to Kubernetes" },
  reply: { label: "Reply to a message", extra: "Paste their message", ph: "Paste the email or LinkedIn message here", required: "Paste the message you're replying to" },
  anything: { label: "Anything else", extra: "What do you want to write?", ph: "e.g. ask to move the interview to next week; negotiate the offer up 10%", required: "Say what you want to write" },
};

function emailTask(type, a, F) {
  const c = S.co.get(a.company_id), role = a.position || "the role", extra = F.extra.value.trim();
  const iv = type === "thanks" && F.interview?.value ? findRow("events", +F.interview.value) : null;
  switch (type) {
    case "followup":
      return `Write a short follow-up email about my application for ${role} at ${c.name}${a.date_applied ? `, which I sent on ${fmtDate(a.date_applied, { year: true })} (${ago(daysSince(a.date_applied))})` : ""}. ` +
        `Restate my interest, point to one or two specific things from my background or projects that fit this role, and ask politely about next steps. Friendly and confident, not pushy.` +
        (extra ? `\nAlso work this in: ${extra}` : "");
    case "thanks":
      return `Write a thank-you email after my interview${iv ? ` on ${fmtDate(iv.event_date, { weekday: true, year: true })}${iv.body ? ` (${oneLine(iv.body)})` : ""}` : ""} for ${role} at ${c.name}. ` +
        `Thank them for their time, mention something specific we discussed, and briefly restate why I'm a good fit.` +
        (extra ? `\nWhat stood out in the interview: ${extra}` : "\nIf nothing specific from the interview is listed below, keep that part general instead of inventing details.");
    case "reply":
      return `Write my reply to this message from ${c.name} about the ${role} role:\n"""\n${extra || "[their message]"}\n"""\n` +
        `Answer everything they asked. For salary, notice period, availability and similar, use what I've already told them; if it isn't covered, leave a [placeholder] for me to fill in.`;
    default:
      return `${extra || "[what I want to write]"}\n\nThis is about my application for ${role} at ${c.name}.`;
  }
}

function buildEmailPrompt(a, F) {
  const type = F.type.value;
  return [
    `You're helping me write a message about a job I applied for.\n\n## What I need\n${emailTask(type, a, F)}`,
    jobBlock(a), aboutMeBlock(), projectsBlock(),
    section("How to write it", [
      "- Under 150 words. Plain, specific and human; no clichés like \"I hope this email finds you well\".",
      "- Don't invent facts about me, the company or the interview. Where something is missing, leave a [placeholder].",
      "- Stay consistent with what I've already told them.",
      "- Address the right person from \"People there\" when it's clear who; otherwise keep the greeting general.",
      type === "reply" ? "- It's a reply, so no subject line. Sign off with my name." : "- Start with a subject line, then the email. Sign off with my name.",
      `- Today is ${fmtDate(S.data.today, { weekday: true, year: true })}.`,
    ].join("\n")),
  ].filter(Boolean).join("\n\n");
}

const PITCH_TYPES = {
  comment: { label: "Comment on a post", source: "Paste the post (and the comment you're replying to, if any)" },
  dm: { label: "DM / pitch", source: "Paste their profile, post, or what you know about them" },
};
const PLATFORMS = ["LinkedIn", "Reddit", "X / Twitter", "Email", "Other"];

function pitchTask(F) {
  const platform = F.platform.value, goal = F.goal.value.trim();
  if (F.type.value === "comment") {
    const style = platform === "Reddit"
      ? "Match the subreddit's casual tone and be genuinely helpful. Write like a real person: no marketing speak, no hard sell and no links unless someone asked. Mentioning my experience is fine when it's relevant."
      : platform === "LinkedIn"
        ? "Add something of value: an insight, a short experience of mine, or a thoughtful question. Conversational and professional, 2–4 sentences. No hashtags, no \"Great post!\"."
        : "Add something of value in a few sentences, in the tone of the platform.";
    return `Write a comment on this ${platform} post. ${style} Bring up one of my projects only if it genuinely fits.` + (goal ? `\nWhat I'm hoping for: ${goal}` : "");
  }
  return `Write a short direct message (${platform}) to this person. Open with something specific from what they wrote or their profile, ` +
    `mention the one or two projects of mine that are most relevant, and make one clear ask${goal ? `: ${goal}` : ""}. ` +
    (platform === "Email" ? "Under 150 words, with a subject line." : "Under 100 words.") + " Warm and specific; no flattery or buzzwords.";
}

function buildPitchPrompt(F) {
  return [
    `You're helping me write a message.\n\n## What I need\n${pitchTask(F)}`,
    section(F.type.value === "comment" ? "The post" : "About them", `"""\n${F.source.value.trim() || "[paste it here]"}\n"""`),
    aboutMeBlock(), projectsBlock(),
    section("How to write it", [
      "- Don't invent facts about me; use only what's here.",
      "- Sound like a person, not a template.",
      "- Give me two versions: a shorter one and a slightly longer one.",
    ].join("\n")),
  ].filter(Boolean).join("\n\n");
}

// The modal both prompt kinds share: a few choices, the prompt as it'll be copied, and a Copy button.
function promptModal(title, fieldsHtml, build, onChange) {
  const p = S.data.profile[0];
  const empty = !(p.name || p.about || p.headline);
  const m = openModal(`
    <div class="mhead"><h2>${esc(title)}</h2><button class="btn ghost" data-close>✕</button></div>
    <form class="pform" autocomplete="off">${fieldsHtml}</form>
    ${empty ? `<p class="cohint"><b>Your About me is empty.</b> <a href="#" data-go-me>Fill it in on the Me tab</a> so the message is written as you.</p>` : ""}
    ${fld("Prompt to copy", `<textarea class="prompt-out" rows="12" readonly></textarea>`)}
    <div class="actions"><span class="muted pcount"></span><span class="spacer"></span>
      <button class="btn" data-close>Close</button><button class="btn primary" data-copy>Copy prompt</button></div>`, "wide");
  const form = $(".pform", m), out = $(".prompt-out", m);
  const update = () => {
    onChange?.(form.elements);
    out.value = build(form.elements);
    $(".pcount", m).textContent = `${out.value.length.toLocaleString()} characters · paste into ChatGPT, Claude, Gemini…`;
  };
  form.addEventListener("input", update);
  form.addEventListener("change", update);
  $$("[data-close]", m).forEach(b => b.onclick = closeModal);
  $("[data-copy]", m).onclick = async () => {
    const need = $("[data-required]", form);
    if (need && !need.value.trim()) { need.focus(); return toast(need.dataset.required, "error"); }
    try { await navigator.clipboard.writeText(out.value); }
    catch { out.select(); document.execCommand("copy"); }
    toast("Prompt copied");
  };
  update();
  $("select, textarea", form)?.focus();
  return m;
}

function openAppPrompt(appId) {
  const a = findRow("applications", appId), c = S.co.get(a.company_id);
  const interviews = coEvents(c.id).filter(e => e.kind === "interview" && e.event_date && e.event_date <= S.data.today
    && (!e.application_id || e.application_id === a.id)).sort(byWhen).reverse();
  const type = interviews.length && daysSince(interviews[0].event_date) <= 3 ? "thanks" : "followup";
  promptModal(`Write email: ${c.name}`, `
    <div class="grid2">
      ${fld("What kind", `<select name="type">${Object.entries(EMAIL_TYPES).map(([k, t]) => `<option value="${k}" ${k === type ? "selected" : ""}>${t.label}</option>`).join("")}</select>`)}
      <div class="iv-field">${interviews.length ? fld("Which interview", `<select name="interview">${interviews.map(e => `<option value="${e.id}">${esc(fmtDate(e.event_date, { weekday: true, year: true }))}${e.body ? " · " + esc(clipText(e.body, 50)) : ""}</option>`).join("")}</select>`) : ""}</div>
    </div>
    <label class="fld"><span class="extra-label"></span><textarea name="extra" rows="4"></textarea></label>`,
  F => buildEmailPrompt(a, F),
  F => {
    const t = EMAIL_TYPES[F.type.value], ta = F.extra;
    ta.closest(".fld").querySelector(".extra-label").textContent = t.extra;
    ta.placeholder = t.ph;
    if (t.required) ta.dataset.required = t.required; else delete ta.dataset.required;
    const iv = ta.form.querySelector(".iv-field");
    iv.hidden = F.type.value !== "thanks";
  });
}
const clipText = (t, n) => (t = oneLine(t)).length > n ? t.slice(0, n - 1) + "…" : t;

function openPitchPrompt() {
  promptModal("Write a message", `
    <div class="grid3">
      ${fld("What kind", `<select name="type">${Object.entries(PITCH_TYPES).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join("")}</select>`)}
      ${fld("Where", `<select name="platform">${PLATFORMS.map(p => `<option>${p}</option>`).join("")}</select>`)}
      ${fld("What you want <span class=\"muted\">(optional)</span>", `<input type="text" name="goal" placeholder="e.g. ask for a referral, offer freelance help">`)}
    </div>
    <label class="fld"><span class="source-label"></span><textarea name="source" rows="6" data-required="Paste the post or what you know about them"></textarea></label>`,
  buildPitchPrompt,
  F => { F.source.closest(".fld").querySelector(".source-label").textContent = PITCH_TYPES[F.type.value].source; });
}

function wire() {
  $$(".views button").forEach(b => b.onclick = () => setView(b.dataset.view));
  $("#btn-new").onclick = openNew;
  $("#search").addEventListener("input", e => { S.q = e.target.value; S.sel = -1; isList() ? renderMain() : setView("applications"); });
  $("#search").addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "ArrowDown") { e.preventDefault(); e.target.blur(); S.sel = -1; moveSel(1); if (e.key === "Enter" && S.rows.length === 1) openRow(0); }
  });

  document.addEventListener("click", e => {
    const t = e.target;
    const menu = $("#menu");
    if (menu.open && !menu.contains(t)) menu.open = false;
    const m = t.closest("[data-menu]");
    if (m) {
      menu.open = false;
      if (m.dataset.menu === "import") $("#file-import").click();
      if (m.dataset.menu === "keys") showShortcuts();
      if (m.dataset.menu === "theme") {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
        const nextTheme = cur === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme; store("theme", nextTheme);
      }
      return;
    }
    const ex = t.closest("[data-export]");
    if (ex) { ex.href = `/export/${ex.dataset.export}?t=${encodeURIComponent(TOKEN)}`; menu.open = false; return; }
    if (t.closest("#empty-new")) return openNew();
    const f = t.closest("[data-filter]");
    if (f) { const k = f.dataset.filter; S.filters.has(k) ? S.filters.delete(k) : S.filters.add(k); S.sel = -1; return renderMain(); }
    if (t.closest("[data-clear-status]")) { S.status = null; return renderMain(); }
    if (t.closest("[data-clear]")) { S.filters.clear(); S.status = null; S.q = ""; $("#search").value = ""; return renderMain(); }
    const st = t.closest("[data-stat-status]");
    if (st) { const s = st.dataset.statStatus; S.status = S.status === s ? null : s; if (S.view !== "applications" && S.status) setView("applications"); return renderMain(); }
    const stat = t.closest("[data-stat]");
    if (stat) {
      const k = stat.dataset.stat;
      if (k === "stale") { S.filters.has("stale") ? S.filters.delete("stale") : S.filters.add("stale"); }
      if (k === "notapplied") { S.filters.has("notapplied") ? S.filters.delete("notapplied") : S.filters.add("notapplied"); if (S.view !== "companies") return setView("companies"); }
      if (k === "companies" && S.view !== "companies") return setView("companies");
      if (k === "week") { S.sort.applications = { key: "applied", dir: -1 }; if (S.view !== "applications") return setView("applications"); }
      return renderMain();
    }
    const brief = t.closest("[data-brief]");
    if (brief) { e.stopPropagation(); return openBrief(+brief.dataset.brief, +brief.dataset.briefApp || null); }
    if (t.closest("[data-ghost-all]")) return markGhosted();
    const goMe = t.closest("[data-go-me]");
    if (goMe) { e.preventDefault(); closeModal(); closeDrawer(); setView("me"); return openMeEdit("profile"); }
    const me = t.closest("#me [data-me]");
    if (me) return meAction(me.dataset.me, me);
    if (t.closest("#me [data-act=cancel-edit]")) { S.meEdit = null; return renderMe(); }
    const legend = t.closest("[data-legend-status]");
    if (legend) { S.status = legend.dataset.legendStatus; return setView("applications"); }
    const cal = t.closest("[data-cal]");
    if (cal) { if (+cal.dataset.cal) return shiftMonth(+cal.dataset.cal); S.cal = S.data.today.slice(0, 7); return renderCalendar(); }
    if (t.closest("[data-cal-add]")) return openEventForm();
    const cev = t.closest(".cev");
    if (cev) return cev.dataset.calEv ? openEventForm({ id: +cev.dataset.calEv }) : openDrawer(+cev.dataset.cid, +cev.dataset.calJoin);
    const day = t.closest("[data-day]");
    if (day) return openEventForm({ date: day.dataset.day });
    const up = t.closest("[data-open]");
    if (up) return openDrawer(+up.dataset.open, +up.dataset.openApp || undefined);
  });

  $("#grid thead").addEventListener("click", e => {
    const th = e.target.closest("[data-sort]"); if (!th) return;
    const s = S.sort[S.view];
    if (s.key === th.dataset.sort) s.dir *= -1; else { s.key = th.dataset.sort; s.dir = ["company", "position", "tools", "remote"].includes(s.key) ? 1 : -1; }
    renderMain();
  });
  $("#grid tbody").addEventListener("click", e => {
    if (e.target.closest("select, a, button")) return;
    const tr = e.target.closest("tr[data-i]");
    if (tr) openRow(+tr.dataset.i);
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.status) return setStatus(+el.dataset.status, el.value);
  });

  const drawer = $("#drawer");
  drawer.addEventListener("submit", e => {
    if (!e.target.matches(".eform")) return;
    e.preventDefault();
    saveEdit(e.target);
  });
  drawer.addEventListener("click", e => {
    const tpl = e.target.closest("[data-tpl]");
    if (tpl) return useTemplate(tpl.dataset.tpl);
    const b = e.target.closest("[data-act]");
    if (b) drawerAction(b.dataset.act, b);
  });
  drawer.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      if (e.target.id === "log-body" || e.target.closest(".logform")) { e.preventDefault(); addLog(); }
      const form = e.target.closest(".eform");
      if (form) { e.preventDefault(); form.requestSubmit(); }
      const ev = e.target.closest(".ev[data-ev]");
      if (ev) { e.preventDefault(); drawerAction("save-ev", { dataset: { id: ev.dataset.ev } }); }
    }
  });

  // Chart tooltips: anything with data-tip shows it next to the pointer.
  const tip = $("#tip");
  document.addEventListener("mousemove", e => {
    const el = e.target.closest?.("[data-tip]");
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip;
    tip.hidden = false;
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = Math.max(8, e.clientY - 40) + "px";
  });

  const mePage = $("#me");
  mePage.addEventListener("submit", e => { if (e.target.matches(".eform")) { e.preventDefault(); saveMe(e.target); } });
  mePage.addEventListener("keydown", e => {
    const form = e.target.closest(".eform");
    if (form && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); }
  });
  $("#file-projects").addEventListener("change", e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (file) importProjects(file);
  });
  $("#file-resume").addEventListener("change", e => {
    const files = [...e.target.files];
    e.target.value = "";
    if (files.length) uploadResumes(files);
  });
  // Drop resume files on the Resumes section (its drop box lights up) to upload them. Files dropped anywhere
  // else are ignored, so a missed drop doesn't open the file in the browser and leave the tracker.
  const hasFiles = e => e.dataTransfer?.types.includes("Files");
  const dropZone = e => hasFiles(e) && e.target.closest?.("#me .resumes");
  document.addEventListener("dragover", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    const z = dropZone(e);
    e.dataTransfer.dropEffect = z ? "copy" : "none";
    z?.classList.add("drop");
  });
  document.addEventListener("dragleave", e => { const z = e.target.closest?.("#me .resumes"); if (z && !z.contains(e.relatedTarget)) z.classList.remove("drop"); });
  document.addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    const z = dropZone(e); if (!z) return;
    z.classList.remove("drop");
    uploadResumes([...e.dataTransfer.files]);
  });

  $("#file-import").addEventListener("change", e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (file) importFile(file);
  });

  document.addEventListener("keydown", e => {
    const t = e.target;
    const typing = t.matches("input, textarea, select, [contenteditable]");
    if (e.key === "Escape") {
      if (modalEl) { closeModal(); e.preventDefault(); }
      else if (typing) t.blur();
      else if (S.open?.edit) cancelEdit();
      else if (S.view === "me" && S.meEdit) { S.meEdit = null; renderMe(); }
      else if (S.open) closeDrawer();
      else if (S.q || S.filters.size || S.status) { S.q = ""; $("#search").value = ""; S.filters.clear(); S.status = null; renderMain(); }
      return;
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || modalEl) return;
    const keys = {
      n: () => openNew(),
      "/": () => $("#search").focus(),
      j: () => moveSel(1), ArrowDown: () => moveSel(1),
      k: () => moveSel(-1), ArrowUp: () => moveSel(-1),
      Enter: () => S.sel >= 0 && openRow(S.sel),
      b: () => S.open && openBrief(S.open.cid, S.open.appId),
      1: () => setView("dashboard"),
      2: () => setView("applications"),
      3: () => setView("companies"),
      4: () => setView("calendar"),
      5: () => setView("me"),
      ...(S.view === "calendar" ? { ArrowLeft: () => shiftMonth(-1), ArrowRight: () => shiftMonth(1) } : {}),
      "?": () => showShortcuts(),
    };
    if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
  });

  // Warn before closing the tab with an unsaved form open in the company panel.
  window.addEventListener("beforeunload", e => { if (S.open?.edit || S.meEdit) e.preventDefault(); });
}

(async function start() {
  const theme = store("theme");
  if (theme) document.documentElement.dataset.theme = theme;
  wire();
  try {
    await reload();
    renderMain();
  } catch (err) {
    document.querySelector(".wrap").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
